<style>
/* basic reset: no page margin, phone notches respected */
html { box-sizing: border-box; } *, *::before, *::after { box-sizing: inherit; }
body { margin: 0; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* SPEAK sparkles: little four-point stars that twinkle over the bright half of the sign.
   Each star grows, turns a quarter turn and fades, on its own delay, so they never blink together. */
/* The storefront pins this sign over its door glass (position: absolute). On this page that
   invisible box stretched down over the Back button and swallowed the click, so the sign sits
   in the normal flow here, and clicks pass straight through it. */
.nrsf.nrsk .nrsf-speak { position: static; pointer-events: none; } /* ".nrsf.nrsk" outranks the storefront rule, which loads after this one */
.nrsk .nrsf-speak svg { overflow: visible; } /* let stars on the edge of the sign spill past it instead of being cut off */
.nrsk-sparkles { filter: drop-shadow(0 0 1.5px #ffe7a8) drop-shadow(0 0 4px rgba(255, 214, 140, .7)); }
.nrsk-sparkles path {
  fill: #fffaf0; opacity: 0;
  transform-box: fill-box; transform-origin: center;
  animation: nrsk-twinkle 2.6s ease-in-out infinite;
}
@keyframes nrsk-twinkle {
  0%, 100% { opacity: 0; transform: scale(.15) rotate(0deg); }
  45%      { opacity: 1; transform: scale(1) rotate(45deg); }
  60%      { opacity: .9; transform: scale(.85) rotate(60deg); }
}
/* People who ask their device for less motion get a few stars that simply stay lit, and no shine */
@media (prefers-reduced-motion: reduce) {
  .nrsk-sparkles path { animation: none; opacity: .85; }
  .nrsk-sparkles .busy, .nrsk-glint { display: none; }
}
</style>
<link rel="stylesheet" href="../assets/storefront.css">
