/* ======================================================================
   NOT RISING · THE SPEAK (speakeasy/), behind door 9¾ at 777 Daydream St.
   ----------------------------------------------------------------------
   Built like THE POST and Nebula Cafe: Kathi's photoreal renders are the
   rooms, and everything live is laid on top in PERCENTAGES of each picture,
   so it stays on the right spot at every screen size.

   Four rooms. go() in the script is the only way between them, whichever
   button you press, and the browser's own Back button walks you back the
   way you came (each room has its own address: #passage, #hall, #stage, #bar).
     1. THE PASSAGE (speak/passage-*.webp). Scrolling walks you down it to the
        black door, THE SPEAK.
     2. THE HALL (speak/hall-*.webp). You land up top and scroll down.
     3. THE STAGE (speak/stage-*.webp), up close: from the hall's stage or the
        STAGE button.
     4. THE BAR (speak/bar-*.webp), from the hall's bar or the BAR button, or
        the stage's THE BAR. Kathi sits at the bar and says hello in a chat.
   What's on the stage and what Kathi says come from NRSPEAK in assets/data.js
   (PART 4): every marquee says NOW PLAYING, then the show.
   Each picture comes in three sizes (1600, 2400 and 3200 pixels wide): the
   browser downloads only the one the screen needs, so it's sharp and light.
   ====================================================================== */
:root {
  color-scheme: dark;
  /* layout: each room is one picture; the passage walks you to its door, the hall scrolls down, the stage fills the screen */
  --night: #070605;      /* the dark around the rooms */
  --ink: #f6efe2;        /* lettering over the rooms */
  --gold: #d9b45f;       /* the "Teleporting" sign */
  --board: #f8f3ea;      /* the white marquee boards */
  --flame: 255,196,120;  /* candlelight, as r,g,b */
  --display: Oswald, "Arial Narrow", sans-serif;
  --body: Arimo, "Helvetica Neue", Arial, sans-serif;
}
html, body { background: var(--night); color: var(--ink); }
body { margin: 0; overflow-x: clip; font-family: var(--body); }
[hidden] { display: none !important; }
.label { font: 700 10px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; }

/* ---- CANDLELIGHT: a warm glow over each flame in the picture, breathing on its own clock ---- */
.flame { position: absolute; width: var(--s, 6%); aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(var(--flame), .5), rgba(var(--flame), .16) 38%, transparent 70%);
  animation: flick var(--d, 2.6s) ease-in-out infinite alternate; }
@keyframes flick { 0% { opacity: .55; scale: .94; } 40% { opacity: .9; } 70% { opacity: .7; scale: 1.04; } 100% { opacity: 1; scale: .98; } }
.dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }

/* ---- 1 · THE PASSAGE: a tall section; the view stays put while you scroll, and walks you to the door.
   The picture always fills the screen, however wide (the script works out how big, and where it looks). ---- */
.passage { position: relative; height: 300vh; }
.p-stick { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
.p-frame { position: absolute; left: 0; top: 0; aspect-ratio: 2 / 3; transform-origin: 0 0; will-change: transform; }
.p-frame > img { display: block; width: 100%; height: 100%; filter: brightness(.12); transition: filter 2.2s ease .4s; }
.passage.lit .p-frame > img { filter: none; }
.p-frame.narrow > img { -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent); mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent); }
.passage .flame { opacity: 0; }
.passage.lit .flame { animation: ignite .5s ease-out calc(var(--i) * .22s) both, flick var(--d) ease-in-out calc(var(--i) * .22s + .5s) infinite alternate; }
@keyframes ignite { from { opacity: 0; scale: .3; } to { opacity: .9; scale: 1; } }
.enter.crystal { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); translate: -50% 0; padding: 5px; border-radius: 6px; transition: opacity .4s; }
.enter[hidden] { display: block !important; opacity: 0; pointer-events: none; }

/* ---- 2 · THE HALL: a tall picture you scroll down, as wide as the screen; on phones a centred slice ---- */
.hall { position: relative; overflow: hidden; background: var(--night); }
.art { position: relative; width: 100vw; aspect-ratio: 2 / 3; }
@media (max-aspect-ratio: 9/10) { .art { width: 170vw; margin-left: -35vw; } }
.art > img, .s-wrap > img { display: block; width: 100%; height: 100%; filter: brightness(.05); transition: filter 1.8s cubic-bezier(.3,.6,.2,1); }
.lit .art > img, .lit .s-wrap > img { filter: none; }
@media (max-aspect-ratio: 9/10) { .cellar .art { width: 140vw; margin-left: -40vw; } }   /* phones: the right of the room, so the TV is in view */
/* THE CELLAR's TV: its screen breathes a little light (held still for visitors who ask for less motion) */
.tv-glow { position: absolute; left: 77.1%; top: 50.4%; width: 17%; height: 10.4%; border-radius: 22%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(205,225,230,.22), rgba(205,225,230,0)); mix-blend-mode: screen; opacity: 0; }
.lit .tv-glow { animation: tvglow 3.2s ease-in-out infinite; }
@keyframes tvglow { 0%, 100% { opacity: .35; } 45% { opacity: .9; } 50% { opacity: .55; } 55% { opacity: 1; } }
.tvcard { width: min(86vw, 420px); aspect-ratio: 4 / 3; display: grid; place-items: center; padding: 8%; box-sizing: border-box;
  border-radius: 18% / 22%; color: #eef2f0; text-align: center;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px), radial-gradient(ellipse at 50% 45%, #4b5753, #1d2321 75%);
  box-shadow: inset 0 0 0 10px #a2804a, inset 0 0 0 12px #6f5530, inset 0 0 40px rgba(0,0,0,.8), 0 20px 60px rgba(0,0,0,.7); }
.tv-text { margin: 0; display: grid; gap: .7em; font-family: Oswald, "Arial Narrow", sans-serif; font-weight: 600; text-transform: uppercase;
  letter-spacing: .04em; line-height: 1.15; font-size: clamp(17px, 5.2vw, 24px); text-shadow: 0 0 8px rgba(220,240,235,.45); }
.tv-text span + span { color: #fff; }
/* THE RESTROOM SIGN: the hall's picture shows RESTROOM with REST lit. This small picture is the same sign with REST
   dead too, laid exactly over it (in percentages of the hall's picture, like everything else). Showing it puts REST
   out, so flickering it on and off is the blink: a failing neon that stutters, dies for a moment, and catches again.
   It sits in the dark like the rest of the room until the lights come up. */
.neon { position: absolute; pointer-events: none; opacity: 0; animation: neon 6.5s steps(1, end) infinite; }
.neon > img { display: block; width: 100%; height: 100%; filter: brightness(.05); transition: filter 1.8s cubic-bezier(.3,.6,.2,1); }
.lit .neon > img { filter: none; }
@keyframes neon { 0% { opacity: 0 } 38% { opacity: 1 } 39.5% { opacity: 0 } 41% { opacity: 1 } 42% { opacity: 0 }
  66% { opacity: 1 } 75% { opacity: 0 } 77% { opacity: 1 } 78% { opacity: 0 } 100% { opacity: 0 } }

/* ---- 3 · THE STAGE: the picture fills the screen (the edges trim away on narrow screens); nothing scrolls.
   The picture is 3:2 (3600 x 2400: the stage close-up, from the arch's apex to the stage lip), so filling the screen's
   height takes a width of 150vh.
   --w is its width: big enough to fill the screen, but
     never so big that a tall phone loses Dan or Kathi (with their chairs, they span the middle 56% of the picture), and
     never so big that a very wide screen loses the arch off the top or the stage lip off the bottom (163vh).
   top: when the picture is taller than the screen, a little more is trimmed from the floor than from the arch;
   when it is shorter (tall phones), it sits in the middle. ---- */
.stage { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
.s-wrap { --w: min(max(100vw, 150vh), calc(100vw / .56), 163vh); --h: calc(var(--w) * 2 / 3);
  position: absolute; left: 50%; width: var(--w); aspect-ratio: 3 / 2; translate: -50% 0;
  top: max(calc(50% - var(--h) / 2), min(0px, max(calc(100% - var(--h)), calc(50% - var(--h) * .48)))); }
/* very tall phones: the picture may not reach the top and bottom; its top and bottom edges fade into the dark,
   and the buttons sit on that dark. Very wide screens: the same at the left and right edges. */
@media (max-aspect-ratio: 84/100) { #room-stage .s-wrap > img { -webkit-mask-image: linear-gradient(transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(transparent, #000 7%, #000 93%, transparent); } }
@media (min-aspect-ratio: 163/100) { #room-stage .s-wrap > img { -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); } }

/* ---- 4 · THE BAR: built like the stage, for a 16:9 picture too (3600 x 2026: filling the screen's height takes 177.7vh).
   --w is its width: big enough to fill the screen, but
     never so big that a phone loses part of the marquee (the marquee is 40% of the picture's width), and
     never so big that a wide screen loses the marquee off the top or Kathi's boots off the bottom (205vh).
   top: when the picture is taller than the screen, it's trimmed evenly around the middle of the marquee-to-boots band
   (49% down); when it's shorter, it sits in the middle. ---- */
.b-wrap { --w: min(max(100vw, 177.7vh), calc(100vw / .40), 205vh); --h: calc(var(--w) * 941 / 1672); aspect-ratio: 1672 / 941;
  top: max(calc(50% - var(--h) / 2), min(0px, max(calc(100% - var(--h)), calc(50% - var(--h) * .49)))); }
#room-bar .tiles .l1, #room-bar .tiles .l2 { font-size: min(34cqh, 8cqw); }
/* screens taller than wide: the picture is lifted so Kathi's boots (91% of the way down) end above the panel, and its
   top and bottom edges fade into the dark. Screens wider than tall: the panel moves left, under the empty stools,
   so it never covers her. Very wide screens: the sides fade into the dark, as on the stage. */
@media (max-aspect-ratio: 1/1) {
  .b-wrap { top: max(calc(var(--h) * -.07), min(calc(50% - var(--h) / 2), calc(100% - 76px - var(--h) * .91))); }
  #room-bar .s-wrap > img { -webkit-mask-image: linear-gradient(transparent, #000 6%, #000 90%, transparent); mask-image: linear-gradient(transparent, #000 6%, #000 90%, transparent); }
}
@media (min-aspect-ratio: 1/1) { #panel-bar { left: 28%; } }
@media (min-aspect-ratio: 205/100) { #room-bar .s-wrap > img { -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); } }
/* KATHI: an invisible button over her on the stool (not a ".spot", so it never draws a box around her) */
.b-kathi { position: absolute; left: 48.8%; top: 27.4%; width: 17.6%; height: 63.6%; margin: 0; padding: 0; border: 0; border-radius: 40% 40% 12% 12%;
  background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.b-kathi:focus-visible { outline: 2px solid rgba(255,255,255,.8); outline-offset: -2px; }
/* KATHI'S CHAT: ONE crystal bubble like Nebula Cafe's "Hi, Human!", whose words change at reading pace (the script,
   say()), then a crystal FOLLOW button under it. It sits just left of her face (its right edge at 55.4% across the
   picture, its top at 31% down) and grows leftward; its tail points at her. Its letter size follows the picture's
   width (--w), from 12 to 17px. It arrives in two steps (the script adds the classes): "in" springs it in showing
   three typing dots, then removing "typing" swaps the dots for the words; each new line fades up in place. */
.chat { position: absolute; z-index: 2; right: 44.6%; top: 31%; width: min(21em, 52vw); display: flex; flex-direction: column; align-items: flex-end; gap: .45em;
  font: 700 clamp(12px, calc(var(--w) * .0102), 17px)/1.3 var(--body); color: #fff; pointer-events: none; }
.chat.on > * { pointer-events: auto; }   /* only the bubbles and the button catch a tap; the space beside a short bubble is the room */
.msg.crystal { margin: 0; max-width: 100%; box-sizing: border-box; padding: .55em .85em; border-radius: .95em; text-wrap: pretty;
  background: linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.08) 42%, rgba(255,255,255,.04) 58%, rgba(255,255,255,.2)), rgba(18,16,20,.6);
  opacity: 0; transform: translateX(.5em) scale(.8); transform-origin: 100% 50%; transition: opacity .2s, transform .2s; }
.msg.in { opacity: 1; transform: none; transition: opacity .2s, transform .5s cubic-bezier(.2, 1.5, .4, 1); }
.msg .dots { display: flex; gap: .22em; padding: .32em .1em; }
.msg .dots i { width: .32em; height: .32em; border-radius: 50%; background: rgba(255,255,255,.92); animation: dot-hop .6s ease-in-out infinite; }
.msg .dots i:nth-child(2) { animation-delay: .1s; } .msg .dots i:nth-child(3) { animation-delay: .2s; }
.msg .words { display: block; animation: words-in .35s ease-out; }
.msg.typing .words, .msg:not(.typing) .dots { display: none; }
@keyframes dot-hop { 0%, 60%, 100% { transform: none; opacity: .55; } 30% { transform: translateY(-.18em); opacity: 1; } }
@keyframes words-in { from { opacity: 0; transform: translateY(.25em); } }
.msg .tail { position: absolute; left: calc(100% - 1px); top: .5em; width: .7em; height: .84em; overflow: visible; }
.chat .go-panel { margin-top: .35em; opacity: 0; transform: translateY(.4em); transition: opacity .3s, transform .4s; }
.chat .go-panel.in { opacity: 1; transform: none; }
.chat .go { font-size: 10px; padding: 11px 14px; }
/* DAN'S BUBBLE on the stage in the hall: the same crystal bubble, above and right of his head, its tail pointing down
   at him. It's a button: it opens the NOW PLAYING card. Its letter size follows the picture's width (11 to 16px). */
.art { container-type: inline-size; }
.say-dan { position: absolute; z-index: 2; left: 41.2%; bottom: 46.5%; width: min(21em, 31%); display: flex; pointer-events: none;
  font: 700 clamp(11px, 1.05cqw, 16px)/1.3 var(--body); }
.say-dan .msg { font: inherit; text-align: left; transform-origin: 0 100%; transform: translateY(.4em) scale(.8); }
.say-dan .msg.in { pointer-events: auto; transform: none; }
.say-dan .tail { left: .9em; top: calc(100% - 1px); width: .84em; height: .7em; }
@media (hover: hover) { .say-dan .msg.in:hover { background-color: rgba(255,255,255,.12); } }
.say-dan .msg:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* the marquees' live letters, on the boards Kathi's renders already have (painted blank) */
.board { position: absolute; display: grid; place-items: center; container-type: size; opacity: 0; transition: opacity 1s ease 1s; }
.lit .board { opacity: 1; }
.tiles { display: grid; justify-items: center; gap: .04em; font-family: var(--display); font-weight: 600; color: #17120d; line-height: 1;
  text-shadow: 0 1px 0 rgba(0,0,0,.15), 0 3px 5px rgba(0,0,0,.12); }
.tiles .l1, .tiles .l2 { font-size: min(36cqh, 6.4cqw); white-space: nowrap; }
.tiles .l1 { letter-spacing: .05em; } .tiles .l2 { letter-spacing: .02em; }
.tiles .l2:empty { display: none; }

/* ---- THE SPOTS: invisible buttons on a picture. A warm glow when you point at one ---- */
.spot { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 6px; transition: background .3s, box-shadow .3s; }
.spot:hover, .spot:focus-visible { background: rgba(255,236,200,.07); box-shadow: 0 0 0 1px rgba(255,236,200,.2), 0 0 40px rgba(255,200,130,.2); }
.spot:focus-visible { outline: 2px solid rgba(255,255,255,.8); outline-offset: 2px; }
@media (hover: none) { .spot:hover { background: transparent; box-shadow: none; } }

/* ---- CRYSTAL GLASS: THE POST's own ---- */
.crystal { position: relative; isolation: isolate; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.55);
  background: linear-gradient(135deg, rgba(255,255,255,.3), rgba(255,255,255,.07) 42%, rgba(255,255,255,.04) 58%, rgba(255,255,255,.18));
  -webkit-backdrop-filter: blur(6px) saturate(1.5) brightness(1.08); backdrop-filter: blur(6px) saturate(1.5) brightness(1.08);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.2), 0 4px 14px rgba(0,0,0,.3); }
.crystal::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(115deg, rgba(255,120,170,.55), rgba(255,220,120,.5) 25%, rgba(120,255,200,.45) 50%, rgba(120,170,255,.55) 75%, rgba(220,140,255,.5));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: .7; }
button.crystal, a.crystal { border: 0; cursor: pointer; color: #fff; }

.topbar { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(16px, env(safe-area-inset-right, 0px)); padding: 7px 10px; border-radius: 3px; }
.topbar:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
@media (hover: hover) { .back:hover, .topbar:hover { background-color: rgba(255,255,255,.14); } }
.back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(16px, env(safe-area-inset-left, 0px)); text-decoration: none; padding: 7px 10px; border-radius: 3px; }
.back:focus-visible, .go:focus-visible, .panel button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.tag { position: fixed; z-index: 7; pointer-events: none; white-space: nowrap; transform: translate(14px, 14px); padding: 8px 12px; border-radius: 3px; }
.cue { position: fixed; z-index: 5; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%); margin: 0;
  display: grid; justify-items: center; gap: 6px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none; transition: opacity .4s; }
.cue::after { content: ""; width: 11px; height: 11px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); animation: bob 1.6s ease-in-out infinite; }
.cue.gone { opacity: 0; }
@keyframes bob { 50% { transform: translateY(5px) rotate(45deg); } }

/* THE PANELS: crystal, plain white arrows (one drawing, turned; the slanted ones drawn 17% longer to look equal) */
.panel { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 5px; border-radius: 6px; }
.panel button { margin: 0; padding: 9px 12px; border-radius: 3px; text-align: left; white-space: nowrap; display: flex; align-items: center; gap: 8px;
  font: 700 9px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; }
.panel button:active { background-color: rgba(255,255,255,.3); }
.panel .soon { margin-left: auto; font-size: 7px; letter-spacing: .14em; color: rgba(255,255,255,.7); }
.panel .arw { flex: none; width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
@media (hover: hover) { .panel button:hover { background-color: rgba(255,255,255,.14); } }

/* TELEPORTING (gold, the box holds steady, only the dots move) and the veil between rooms */
.teleport, .veil { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--night); transition: opacity .8s; }
.teleport p { margin: 0; padding: 14px 22px; border: 1px solid rgba(217,180,95,.6); font: 600 13px/1 var(--display); letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
.teleport i { font-style: normal; animation: dot 1.2s steps(1) infinite; } .teleport i:nth-child(2) { animation-delay: .2s; } .teleport i:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 50% { opacity: .15; } }
.teleport.gone, .veil.gone { opacity: 0; pointer-events: none; }
.veil { background: #000; transition: opacity .7s; }

/* ---- THE POPUPS: built like THE POST's (the room dimmed and blurred behind, a card, a crystal button, a round x) ---- */
dialog.pop { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 16px; border: 0; box-sizing: border-box;
  background: rgba(6,6,8,.84); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); color: var(--ink); overscroll-behavior: contain; }
dialog.pop[open] { display: grid; place-items: center; animation: fade .35s ease-out; }
dialog.pop::backdrop { background: transparent; }
@keyframes fade { from { opacity: 0; } }
.box { position: relative; display: grid; justify-items: center; gap: 20px; outline: none; animation: pop .35s cubic-bezier(.2,.7,.2,1); }
@keyframes pop { from { opacity: 0; scale: .92; } }
.close { position: absolute; top: -14px; right: -14px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #555; background: #111; color: #f4f1ea;
  font: 400 24px/1 var(--body); display: grid; place-items: center; cursor: pointer; padding: 0; }
.close:hover, .close:focus-visible { background: #f4f1ea; color: #111; outline: none; }
.go-panel { display: inline-block; padding: 5px; border-radius: 6px; }
.go { display: inline-flex; align-items: center; gap: .9em; padding: 13px 18px; border-radius: 3px; white-space: nowrap; text-decoration: none; font: 700 12px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; }
.go .arr { font-size: 1.35em; letter-spacing: 0; transition: transform .2s; }
.go[aria-disabled="true"] { opacity: .55; cursor: default; }
@media (hover: hover) { a.go[href]:hover, button.go:hover { background-color: rgba(255,255,255,.18); } a.go[href]:hover .arr, button.go:hover .arr { transform: translateX(3px); } }
.card { --w: min(86vw, 400px); width: var(--w); margin: 0; overflow: hidden; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
.bmc { text-align: center; background: #f4f4f4; color: #1c1c1c; }
.bmc-banner { display: grid; place-items: center; height: calc(var(--w) * .25); padding-bottom: calc(var(--w) * .04); background: #000; color: #ebebeb; white-space: nowrap; letter-spacing: -.01em;
  font: 400 calc(var(--w) * .142)/1 "Archivo Black", "Arial Black", Impact, sans-serif; }
.bmc-avatar { position: relative; display: block; width: calc(var(--w) * .27); height: auto; aspect-ratio: 1; object-fit: cover; margin: calc(var(--w) * -.105) auto 0;
  border: 3px solid #f4f4f4; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.18); background: #ddd; }
.bmc figcaption { display: grid; gap: 6px; padding: 12px 16px 22px; }
.bmc-name { font: 700 clamp(17px, 4.8vw, 20px)/1.2 var(--body); }
.where { font: 400 12px/1.3 var(--body); color: #6b6b6b; }
/* the popup marquee, built like the marquees in the renders: a dark bronze frame with rounded corners,
   gold Edison bulbs all round (the script places them), and a warm-lit slatted board */
.mcard { width: min(86vw, 440px); aspect-ratio: 3 / 1.25; position: relative; container-type: size; border-radius: 7cqh;
  background: radial-gradient(130% 150% at 50% 50%, transparent 55%, rgba(0,0,0,.35)), linear-gradient(#4a2e18, #311d0f 50%, #23150a);
  box-shadow: inset 0 1px 0 rgba(255,214,160,.35), inset 0 0 0 1px rgba(150,100,50,.45), inset 0 -2px 6px rgba(0,0,0,.5),
    0 20px 60px rgba(0,0,0,.7), 0 0 60px rgba(255,170,80,.25); }
.mcard .mboard { position: absolute; left: 6%; right: 6%; top: 14%; bottom: 14%; display: grid; place-items: center; border: 2px solid #140b05; border-radius: 4px; container-type: size;
  box-shadow: 0 0 0 1px rgba(160,110,60,.35), inset 0 0 0 1px rgba(255,225,180,.5), inset 0 0 26px rgba(255,165,80,.32);
  background: linear-gradient(180deg, rgba(0,0,0,0) calc(100% - 3px), rgba(150,120,90,.45) calc(100% - 3px) calc(100% - 1px), rgba(255,248,236,.9) calc(100% - 1px)) 0 0 / 100% calc(100% / 5) repeat-y, radial-gradient(ellipse 70% 120% at 50% 40%, #fbf2e3, #f4e4cc 70%, #e8d2b3); }
.mcard .tiles .l1 { font-size: min(17cqh, 6cqw); } .mcard .tiles .l2 { font-size: min(19cqh, 6.4cqw); }
.mcard .tiles .note { font: 400 min(9cqh, 4cqw)/1.2 var(--body); color: #555; letter-spacing: .02em; margin-top: .5em; }
.mcard .bulbs { position: absolute; inset: 0; pointer-events: none; }
/* (each bulb is pulled back by half its size with margins, not translate, so its halo can sit behind it) */
.mcard .bulbs i { position: absolute; width: 9.5cqh; height: 9.5cqh; margin: -4.75cqh 0 0 -4.75cqh; border-radius: 50%;
  background: radial-gradient(circle at 46% 42%, #fffef8 0 30%, #fff4d8 44%, #ffd890 60%, #f7a444 75%, #c8661a 88%, #6e3209);
  box-shadow: .4cqh .65cqh 0 .3cqh rgba(14,7,2,.92), 0 0 1.4cqh .45cqh rgba(255,196,110,.95), 0 0 4cqh 1.1cqh rgba(255,150,50,.5); }
.mcard .bulbs i::before { content: ""; position: absolute; inset: -170%; z-index: -1; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,178,80,.6), rgba(255,140,40,.22) 38%, transparent 66%);
  animation: bulb-glow 2.8s ease-in-out calc(var(--i) * -.37s) infinite alternate; }
@keyframes bulb-glow { from { opacity: .68; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .flame, .passage.lit .flame { animation: none; opacity: .85; }
  .p-frame > img, .art > img, .s-wrap > img, .board, .teleport, .veil { transition: none; }
  .lit .tv-glow { animation: none; opacity: .7; }
  .cue::after, .teleport i, dialog.pop[open], .box, .msg .dots i, .msg .words { animation: none; }
  .msg.crystal, .msg.in, .chat .go-panel { transition: none; }
  .dust { display: none; }
  .mcard .bulbs i::before { animation: none; }
  .neon { animation: none; }
}
</style>
</head>

  <button class="crystal" type="button" data-room="hall"><svg class="arw" style="rotate:270deg" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10.5V1.5M2.2 5.3 6 1.5l3.8 3.8"/></svg>Back to Hall</button>
  <button class="crystal" type="button" data-pop="bar"><svg class="arw" style="rotate:90deg" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10.5V1.5M2.2 5.3 6 1.5l3.8 3.8"/></svg>Old Fashioned</button>
</nav>
<nav class="panel crystal" id="panel-cellar" hidden aria-label="The cellar">
  <button class="crystal" type="button" data-room="hall"><svg class="arw" style="rotate:270deg" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10.5V1.5M2.2 5.3 6 1.5l3.8 3.8"/></svg>Back to Hall</button>
  <button class="crystal" type="button" data-pop="tv"><svg class="arw" style="rotate:90deg" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10.5V1.5M2.2 5.3 6 1.5l3.8 3.8"/></svg>The TV</button>
</nav>
<!-- TOP RIGHT, on the stage only: straight to THE BAR (BACK TO HALL, top left, is the way back from every room;
     from the bar, that's the only way out, so nothing in the navigation is called anything but its room's name). -->
<button class="topbar crystal label" id="topbar" type="button" data-room="bar" hidden>The Bar &#x2192;&#xFE0E;</button>

<!-- THE POPUPS (each one's button is the only way out of the tiny world) -->
<dialog class="pop" id="pop-bar" aria-label="Buy Me An Old Fashioned">
  <div class="box" tabindex="-1">
    <button class="close" type="button" aria-label="Close">×</button>
    <figure class="card bmc">
      <div class="bmc-banner" aria-hidden="true">NOT RISING</div>
      <img class="bmc-avatar" src="../assets/img/post/kathi-hat.webp" width="240" height="240" alt="Kathi in a wide-brimmed black hat, smiling" loading="lazy">
      <figcaption><span class="bmc-name">Buy Me An Old Fashioned</span><span class="where">buymeacoffee.com/thisisnotrising</span></figcaption>
    </figure>
    <span class="go-panel crystal"><a class="go crystal" id="bar-go" href="https://buymeacoffee.com/thisisnotrising" target="_blank" rel="noopener" aria-label="Support human curation on Buy Me a Coffee (opens in a new tab)">Support Human Curation<span class="arr" aria-hidden="true">&#x2192;&#xFE0E;</span></a></span>
  </div>
</dialog>
<dialog class="pop" id="pop-show" aria-label="On stage">
  <div class="box" tabindex="-1">
    <button class="close" type="button" aria-label="Close">×</button>
    <div class="mcard"><span class="mboard"><span class="tiles" id="show-tiles"></span></span></div>
    <span class="go-panel crystal"><a class="go crystal" id="show-go" aria-disabled="true">Watch<span class="arr" aria-hidden="true">&#x2192;&#xFE0E;</span></a></span>
  </div>
</dialog>
<dialog class="pop" id="pop-tv" aria-label="On the TV">
  <div class="box" tabindex="-1">
    <button class="close" type="button" aria-label="Close">×</button>
    <div class="tvcard"><p class="tv-text"><span>Billion-dollar corporations want this suppressed.</span><span>The algorithm will bury this.</span></p></div>
    <span class="go-panel crystal"><a class="go crystal" id="tv-go" href="https://superhumanpodcast.substack.com/p/perla-mendoza?r=69dykm" target="_blank" rel="noopener" aria-label="Watch before it's buried (opens in a new tab)">Watch Before It's Buried<span class="arr" aria-hidden="true">&#x2192;&#xFE0E;</span></a></span>
  </div>
</dialog>
<dialog class="pop" id="pop-soon" aria-label="Opening soon">
  <div class="box" tabindex="-1">
    <button class="close" type="button" aria-label="Close">×</button>
    <div class="mcard"><span class="mboard"><span class="tiles" id="soon-tiles"></span></span></div>
  </div>
</dialog>

<!-- What is on the stage: NRSPEAK in assets/data.js (PART 4) -->
<script src="../assets/data.js"></script>
<script>
(function () {
/* What's on the stage: NRSPEAK.STAGE in assets/data.js (these are only the fallbacks) */
const SPEAK = window.NRSPEAK || {};
const STAGE = Object.assign({ title: "", episode: "", link: "", button: "Watch", says: [] }, SPEAK.STAGE || {});
const BAR = Object.assign({ oldFashioned: "https://buymeacoffee.com/thisisnotrising", says: [], follow: "", followButton: "Follow" }, SPEAK.BAR || {});
const DOORS = { restroom: "THE RESTROOM" };
document.getElementById("bar-go").href = BAR.oldFashioned;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* EVERY MARQUEE (the hall's, the bar's, the card's) is filled here: NOW PLAYING, then the show */
const lines = `<span class="l1">NOW PLAYING</span><span class="l2">${esc(STAGE.title)}</span>`;
document.querySelectorAll("[data-marquee]").forEach(t => t.innerHTML = lines);
$("show-tiles").innerHTML = lines + (STAGE.episode ? `<span class="note">${esc(STAGE.episode)}</span>` : "");
const showGo = $("show-go");
if (STAGE.link) { showGo.href = STAGE.link; showGo.target = "_blank"; showGo.rel = "noopener"; showGo.removeAttribute("aria-disabled"); }
showGo.firstChild.textContent = STAGE.button;
if (STAGE.link) showGo.setAttribute("aria-label", `${STAGE.button}: ${STAGE.episode || STAGE.title} (opens in a new tab)`);
showGo.addEventListener("click", e => { if (showGo.getAttribute("aria-disabled") === "true") e.preventDefault(); });

/* the gold Edison bulbs around the popups' little marquees: 13 along the top and the bottom, 3 down each side,
   centred on the frame (in percentages of the card). --i gives each its own moment to glow brighter. */
document.querySelectorAll(".mcard").forEach(m => { const pts = []; for (let i = 0; i <= 12; i++) { const x = 4.6 + 90.8 * i / 12; pts.push([x, 7], [x, 93]); } for (let j = 1; j < 4; j++) { const y = 7 + 86 * j / 4; pts.push([3, y], [97, y]); }
  m.insertAdjacentHTML("afterbegin", `<span class="bulbs" aria-hidden="true">${pts.map(([x, y], i) => `<i style="left:${x}%;top:${y}%;--i:${(i * 7) % 11}"></i>`).join("")}</span>`); });

/* POPUPS: the spot on a picture and the panel button call the same open() */
function open(what) {
  tag.hidden = true;
  if (what in DOORS) { $("soon-tiles").innerHTML = `<span class="l1">OPENING SOON</span><span class="l2">${DOORS[what]}</span>`; $("pop-soon").showModal(); return; }
  $("pop-" + what).showModal();
}

/* ROOMS. go() is the only way between them. Each room has its own address (#passage, #hall, #stage, #bar),
   so the browser's Back button walks you back the way you came, and a link can land straight in a room.
     BACK  the way back, top left, in each room: its words, and the room it goes to
     TOP   top right, on the stage only: straight across to the bar */
const ROOMS = { passage: $("room-passage"), hall: $("room-hall"), stage: $("room-stage"), bar: $("room-bar"), cellar: $("room-cellar") };
const BACK = { passage: ["\u2190\uFE0E 777 Daydream St.", null], hall: ["\u2190\uFE0E The passage", "passage"], stage: ["\u2190\uFE0E Back to Hall", "hall"], bar: ["\u2190\uFE0E Back to Hall", "hall"], cellar: ["\u2190\uFE0E Back to Hall", "hall"] };
const TOP = { stage: ["The Bar \u2192\uFE0E", "bar"] };
const veil = $("veil"), back = $("back"), topbar = $("topbar");
let room = null, hallY = 0;
function show(to, from) {
  chatOff();
  for (const k in ROOMS) { ROOMS[k].hidden = k !== to; ROOMS[k].classList.remove("lit"); }
  $("panel-hall").hidden = to !== "hall"; $("panel-stage").hidden = to !== "stage"; $("panel-bar").hidden = to !== "bar"; $("panel-cellar").hidden = to !== "cellar";
  topbar.hidden = !(to in TOP); if (to in TOP) { topbar.textContent = TOP[to][0]; topbar.dataset.room = TOP[to][1]; }
  $("pcue").classList.toggle("gone", to !== "passage"); $("hcue").classList.toggle("gone", to !== "hall");
  const [text, prev] = BACK[to]; back.textContent = text;
  if (prev) { back.href = "#" + prev; back.dataset.room = prev; } else { back.href = "https://nebularising.media/thetradingpost/"; delete back.dataset.room; }
  scrollTo(0, to === "passage" ? (from ? ROOMS.passage.offsetHeight - innerHeight : 0) : to === "hall" && (from === "stage" || from === "bar" || from === "cellar") ? hallY : 0);
  const img = ROOMS[to].querySelector("img");
  return new Promise(res => { if (img.complete && img.naturalWidth) res(); else { img.loading = "eager"; img.addEventListener("load", res, { once: true }); img.addEventListener("error", res, { once: true }); } })
    .then(() => { $("teleport").classList.add("gone"); veil.classList.add("gone"); requestAnimationFrame(() => ROOMS[to].classList.add("lit")); walk(); warm(to);
      if (to === "bar") chatPlay(1300); });                                 // at the bar, Kathi says hello once the lights are up
}
function go(to, fromAddress) {
  if (!(to in ROOMS) || to === room) return;
  if (!fromAddress) { location.hash = to; return; }                         // the address change calls go() again (below)
  if (room === "hall") hallY = scrollY;                                     // remember where you were in the hall
  const from = room; room = to;
  if (!from) { show(to, null); return; }
  veil.classList.remove("gone");
  setTimeout(() => show(to, from), still ? 0 : 700);
}
addEventListener("hashchange", () => go(location.hash.slice(1) || "passage", true));
/* start the next rooms' pictures downloading early, so walking through a door is instant (from the hall: the stage first, then the bar) */
const NEXT = { passage: ["hall"], hall: ["stage", "bar", "cellar"], stage: ["bar"], bar: ["stage"], cellar: ["stage"] };
function warm(at) { NEXT[at].forEach((k, i) => setTimeout(() => { ROOMS[k].querySelector("img").loading = "eager"; }, 1200 + i * 2000)); }

/* SPEECH BUBBLES: ONE crystal bubble each (Dan on the stage in the hall, Kathi at the bar) whose words change at
   reading pace. say(bubble, lines) returns { play(delay), stop() }:
     play  shows the typing dots, then each line in turn, each staying up about a third of a second a word plus a
           second to take it in (1.8 to 5.2 s); after the last line it holds 2.5 s, shows the dots, and starts over.
     stop  puts it away. Each play is counted, so one that's been stopped (or started again) stops where it is.
   The timing is reading pace even for visitors who ask for less motion (only the springs and fades are switched off). */
const pause = ms => new Promise(r => setTimeout(r, ms));
const READ = line => Math.min(5200, Math.max(1800, 1000 + line.trim().split(/\s+/).length * 320));
const TAIL = '<svg class="tail" viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0C1.5 5 5 9.5 10 11.5 6 12 2.5 11 0 9Z" fill="rgba(18,16,20,.62)"/><path d="M0 0C1.5 5 5 9.5 10 11.5 6 12 2.5 11 0 9" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".5"/></svg>';
const TAIL_DOWN = '<svg class="tail" viewBox="0 0 12 10" aria-hidden="true"><path d="M3 0C3.8 4 2.2 7.4 0 10 5 8.6 8.6 5 11 0Z" fill="rgba(18,16,20,.62)"/><path d="M3 0C3.8 4 2.2 7.4 0 10 5 8.6 8.6 5 11 0" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".5"/></svg>';
const DOTS = '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="words"></span>';
function say(el, lines, onPass) {
  let run = 0;
  return {
    async play(delay = 0) {
      const r = ++run; el.classList.remove("in", "typing");
      await pause(delay); if (r !== run || !lines.length) return;
      el.classList.add("in", "typing"); await pause(900);
      for (;;) {
        for (const line of lines) {
          if (r !== run) return;
          const w = el.querySelector(".words"), n = w.cloneNode(); n.textContent = line; w.replaceWith(n);   // a new node, so it fades up again
          el.classList.remove("typing");
          await pause(READ(line));
        }
        if (r !== run) return;
        if (onPass) onPass();
        await pause(2500); if (r !== run) return;
        el.classList.add("typing"); await pause(900);
      }
    },
    stop() { run++; el.classList.remove("in", "typing"); }
  };
}

/* KATHI AT THE BAR. What she says: NRSPEAK.BAR.says (assets/data.js, PART 4), one line per change of words; the FOLLOW
   button under it (NRSPEAK.BAR.follow and followButton) comes in after the first time through.
     chatPlay(delay)  starts her bubble: by itself as you arrive at the bar (show(), above); pointing at Kathi, tapping
                      her, or Tab to her starts it again.
     chatOff()        puts it away: a click anywhere else at the bar, Esc, or leaving the bar.
   Screen readers get all her lines at once (the hidden sentence), not the changing bubble. */
const chat = $("chat"), bKathi = $("b-kathi");
chat.innerHTML = `<p class="msg crystal" aria-hidden="true">${TAIL}${DOTS}</p><span class="sr-only">${esc(BAR.says.join(" "))}</span>`
  + (BAR.follow ? `<span class="go-panel crystal"><a class="go crystal" id="follow-go" href="${esc(BAR.follow)}" target="_blank" rel="noopener" aria-label="${esc(BAR.followButton)} (opens in a new tab)">${esc(BAR.followButton)}<span class="arr" aria-hidden="true">&#x2192;&#xFE0E;</span></a></span>` : "");
const follow = chat.querySelector(".go-panel");
const kathiSays = say(chat.querySelector(".msg"), BAR.says, () => { if (follow) follow.classList.add("in"); });
let chatOn = false;
function chatPlay(delay = 0) { chatOn = true; bKathi.setAttribute("aria-expanded", "true"); chat.classList.add("on"); kathiSays.play(delay); }
function chatOff() {
  if (!chatOn) return;
  chatOn = false; bKathi.setAttribute("aria-expanded", "false"); chat.classList.remove("on"); kathiSays.stop();
  if (follow) follow.classList.remove("in");
}
bKathi.addEventListener("click", () => { if (!chatOn) chatPlay(); });
bKathi.addEventListener("pointerenter", e => { if (e.pointerType === "mouse" && !chatOn) chatPlay(); });
bKathi.addEventListener("focus", () => { if (bKathi.matches(":focus-visible") && !chatOn) chatPlay(); });

/* DAN ON THE STAGE, in the hall. What he says: NRSPEAK.STAGE.says. His bubble plays while it's on screen (it stops when you
   scroll away or leave the hall, and starts again from the top when you come back); tapping it opens NOW PLAYING. */
const danBox = $("say-dan");
if (STAGE.says.length) {
  danBox.innerHTML = `<button class="msg crystal" type="button" data-pop="show" aria-label="Dan: ${esc(STAGE.says.join(" "))} (now playing)">${TAIL_DOWN}${DOTS}</button>`;
  const danSays = say(danBox.firstChild, STAGE.says);
  new IntersectionObserver(([e]) => { if (e.isIntersecting && room === "hall") danSays.play(500); else danSays.stop(); }, { threshold: .6 }).observe(danBox);
}
addEventListener("keydown", e => { if (e.key === "Escape" && chatOn && !document.querySelector("dialog[open]")) chatOff(); });

document.addEventListener("click", e => {
  if (chatOn && !e.target.closest("#chat, #b-kathi")) chatOff();          // a click anywhere else puts Kathi's chat away
  const r = e.target.closest("[data-room]"); if (r) { e.preventDefault(); go(r.dataset.room); return; }
  const t = e.target.closest("[data-pop]"); if (t) { open(t.dataset.pop); return; }
  if (e.target.closest(".close")) e.target.closest("dialog").close();
  else if (e.target.tagName === "DIALOG") e.target.close();                 // a click on the dimmed room closes the popup
});

/* the name tag that follows the pointer over a spot */
const tag = $("tag");
document.querySelectorAll(".spot").forEach(s => {
  s.addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; tag.textContent = s.dataset.name; tag.hidden = false; tag.style.left = e.clientX + "px"; tag.style.top = e.clientY + "px"; });
  s.addEventListener("pointerleave", () => tag.hidden = true);
});

/* WALKING THE PASSAGE. The corridor picture always fills the screen (as wide as the screen, or as tall, whichever is
   bigger). You arrive seeing the door at the end of the corridor, the ivy at its mouth around the edges. How far you've
   scrolled through the passage (0 to 1) walks you in: the corridor zooms gently towards the door (never more than
   1.35x, so no phone ever has to draw a huge picture) while the door glides to the middle of the screen. On wide
   screens the door already fills most of the height, so the walk is a slow glide; on phones it's a step closer.
   The door is a button the whole way (one click opens it); "Open the door" comes up for the last half of the walk.
   Scrolling back up runs it in reverse. */
const pstick = $("pstick"), pframe = $("pframe");
const DOOR = { x: .497, y: .52, h: .27 };                                   // the door's centre and height, as fractions of the corridor picture
const ZOOM = 1.35;
function walk() {
  if (room === "hall") { $("hcue").classList.toggle("gone", scrollY > 40); return; }
  if (room !== "passage") return;
  /* the corridor's width: the screen's, but on wide screens no more than 1.25x the height (so the door starts at about
     half the screen's height and there's a walk up to it); the sides then fade into the dark, as in the other rooms */
  const vw = pstick.clientWidth, vh = pstick.clientHeight, fw = Math.max(Math.min(vw, vh * 1.25), vh * 2 / 3), fh = fw * 1.5;
  pframe.style.width = fw + "px"; pframe.classList.toggle("narrow", fw < vw - 1);
  const p = Math.min(1, Math.max(0, scrollY / (ROOMS.passage.offsetHeight - innerHeight))), e = still ? 0 : p * p * (3 - 2 * p);
  /* where the walk ends: zoomed until the door is about 3/4 of the screen's height, but never past ZOOM */
  const s1 = Math.min(ZOOM, Math.max(1, .74 * vh / (DOOR.h * fh)));
  const s = 1 + (s1 - 1) * e;
  /* the door's centre on screen: from a little below the middle (the first view) to the middle (the end) */
  const cy0 = vh * .62, cy1 = vh * .5;
  const cx = vw / 2, cy = cy0 + (cy1 - cy0) * e;
  /* the corridor placed (at this scale) to put the door there, but never so far that an edge of the picture shows */
  const x = s * fw > vw ? Math.min(0, Math.max(vw - s * fw, cx - s * DOOR.x * fw)) : (vw - s * fw) / 2,
        y = Math.min(0, Math.max(vh - s * fh, cy - s * DOOR.y * fh));
  pframe.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  $("pcue").classList.toggle("gone", p > .06);
  $("enter").hidden = p < .5;
}
addEventListener("scroll", () => requestAnimationFrame(walk), { passive: true });
addEventListener("resize", () => requestAnimationFrame(walk));

/* DUST in the lamplight: a few warm motes drifting up (only in the room you're in) */
document.querySelectorAll("canvas.dust").forEach(canvas => {
  if (still) return;
  const x = canvas.getContext("2d"), motes = [], n = +canvas.dataset.motes;
  const size = () => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; };
  new ResizeObserver(size).observe(canvas);
  for (let i = 0; i < n; i++) motes.push({ x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.6, v: .00006 + Math.random() * .00016, w: Math.random() * 6.28, a: .15 + Math.random() * .35 });
  (function tick(t) {
    if (!canvas.closest("[hidden]") && canvas.width) {
      x.clearRect(0, 0, canvas.width, canvas.height);
      for (const m of motes) { m.y -= m.v * 16; if (m.y < -.02) { m.y = 1.02; m.x = Math.random(); } const px = (m.x + Math.sin(t / 3000 + m.w) * .006) * canvas.width;
        x.fillStyle = `rgba(255,214,160,${m.a * (.6 + .4 * Math.sin(t / 900 + m.w))})`; x.beginPath(); x.arc(px, m.y * canvas.height, m.r, 0, 7); x.fill(); }
    }
    requestAnimationFrame(tick);
  })(0);
});

/* ARRIVING: the gold Teleporting sign until the first room's picture is in; then its lights come up */
go(location.hash.slice(1) in ROOMS ? location.hash.slice(1) : "passage", true);
})();
</script>
</body>
</html>
