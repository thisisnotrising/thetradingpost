<!--
  NOT RISING · THE POST, the room inside 777 Daydream St.
  ------------------------------------------------------------------
  THE BIG IDEA (Nov 3): ONE PHOTOREAL PICTURE
  The room is one finished picture of the whole hall (assets/img/post/room2/), from the glass roof down to the floor.
  Everything in it is baked in: the Newsstand's 3D marquee, awning and crystal stand with every cover, the Wishing
  Wall, the Gallery's 16 canvas prints, the Best Storyteller poster, the lounge and Nebula Cafe. The page is that
  picture, as wide as the screen: you land up under the glass roof and scroll down into the room. On a phone you see
  the middle of the hall (a tall slice, centred on Nebula Cafe) and the directory takes you to the walls.
  Five invisible buttons sit on the picture (Newsstand, Wishing Wall, Cafe, Gallery, the poster); each opens a popup.
  Inside the café, Kathi greets you (hover over her) and every button opens a card first (Buy Me A Cosmo, her
  Substack); only a card's own button leaves the tiny world.
  (The old 3D stage set, assets/post-stage.js and post-final.js, is no longer used by this page.)

  THIS FILE HAS THREE PARTS
    PART 1 · THE LOOK       (CSS, in the <style> below): the picture, the buttons, the popups
    PART 2 · THE BONES      (HTML, in the <body>): the picture and its buttons, the cue, the popups
    PART 3 · THE BEHAVIOUR  (JavaScript, at the bottom): land, open and close popups, the café, the gallery

  WHERE THINGS COME FROM
    The room and the café: assets/img/post/room2/ (from Kathi's renders, every fix baked in). Three copies of each:
      -2400 (big sharp screens), -1600 (laptops), -phone (the middle slice, for phones held upright).
    The buttons: in percent of the picture, in PART 1 (the ".s-..." and ".c-..." rules).
    The Wishing Wall close-up: assets/img/post/room/wall.webp
    The gallery's photos and label, and the wishes' words: assets/data.js
    The poster up close and its BUY IT link: WALL_POSTER and POSTERS in assets/data.js
    The café's two cards (Buy Me a Coffee, Substack): in PART 2, with Kathi's photo assets/img/post/kathi-hat.webp
  ------------------------------------------------------------------
-->

<style>
/* ================================================================
   PART 1 · THE LOOK
   ================================================================ */

/* --- The page itself: black behind everything. The page scrolls up and down only, never sideways: how far it
   scrolls is how far the camera comes down through the room. While a popup is open it stays put (.locked). --- */
html { box-sizing: border-box; overflow-x: hidden; } *, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; background: #0d0d0e; }
/* (Oct 31) No rubber-band bounce past the top or bottom (it showed black above the roof and below the floor) */
html, body { overscroll-behavior: none; }
/* (Oct 31) The ceiling fan holds still. Spinning right in front of the camera it swept big black blades across the
   view, and it made the browser re-sort the whole room every frame, which is what stuttered. */
.nrp-fan-spin { animation: none !important; }
html.locked, html.locked body { overflow: hidden; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }   /* read aloud by screen readers, not shown */

/* --- THE STAGE: the room's picture, as wide as the screen, as tall as its shape says (the page scrolls down it).
   .stage  the window onto the picture. --x0 and --x1 say which slice of the picture's width shows (0 to 1): all of it
           on a computer; on a phone the middle 40% (a tall slice with Nebula Cafe in the middle).
   .art    the picture and its buttons together, slid left so the slice lines up with the window. The buttons are in
           percent of the WHOLE picture, so they stay on their things at any size, on any screen.
   (A phone downloads only the slice itself, so its picture is laid over just that part of .art.) --- */
.stage { --x0: 0; --x1: 1; position: relative; width: 100%; overflow: hidden; aspect-ratio: 2398 / 2624; background: #0d0d0e; }
@media (max-aspect-ratio: 9/10) { .stage { --x0: .30; --x1: .70; aspect-ratio: 959 / 2624; } }   /* phones: x 30% to 70% */
.art { position: absolute; top: 0; height: 100%; width: calc(100% / (var(--x1) - var(--x0)));
  left: calc(-100% * var(--x0) / (var(--x1) - var(--x0))); }
.art > picture > img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
@media (max-aspect-ratio: 9/10) { .art > picture > img { left: calc(100% * var(--x0)); width: calc(100% * (var(--x1) - var(--x0))); } }
.stage:not(.ready) .art { opacity: 0; }                       /* hidden until the picture has arrived... */
.stage.ready .art { opacity: 1; transition: opacity .6s; }    /* ...then it fades in */

/* where each button sits, in percent of the whole picture (2398 x 2624) */
.s-newsstand { left: 1.5%;   top: 32.01%; width: 20.35%; height: 58.3%; }
.s-wall      { left: 22.19%; top: 41.54%; width: 13.84%; height: 40.78%; }
.s-cafe      { left: 36.7%;  top: 39.25%; width: 29.36%; height: 32.01%; }
.s-poster    { left: 70.31%; top: 47.87%; width: 4.42%;  height: 18.29%; }
.s-gallery   { left: 75.48%; top: 34.3%;  width: 22.27%; height: 51.45%; }

/* --- CRYSTAL GLASS: the look of every button and label that floats over the room (the four spots' name tags,
   the way back out, the phone directory, the popups' close buttons). Clear and see-through, like cut crystal:
     - the room behind shows through, blurred and a little brighter (backdrop-filter)
     - a faint white wash, brighter at the top-left facet (the first gradient)
     - a hairline of light around the edge and a brighter line along the top (the inset box-shadows)
     - a faint rainbow at the edge, the way crystal splits light (the ::before layer, a thin ring of colour)
   White lettering with a soft dark shadow, so it reads over light and dark parts of the room alike. --- */
.crystal { position: relative; isolation: isolate; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.55);
  background: linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.08) 42%, rgba(255,255,255,.04) 58%, rgba(255,255,255,.2));
  -webkit-backdrop-filter: blur(6px) saturate(1.5) brightness(1.08); backdrop-filter: blur(6px) saturate(1.5) brightness(1.08);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.2),
    0 4px 14px rgba(0,0,0,.28); }
.crystal::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(115deg, rgba(255,120,170,.55), rgba(255,220,120,.5) 25%, rgba(120,255,200,.45) 50%, rgba(120,170,255,.55) 75%, rgba(220,140,255,.5));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: .7; }

/* --- THE FIVE BUTTONS: invisible patches on the picture (inside .art, so they move with it).
   pointer-events: auto = they answer to the mouse, though the room around them doesn't. A faint glow on hover. --- */
.spot { position: absolute; display: block; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer;
  pointer-events: auto; transition: background .3s; -webkit-tap-highlight-color: transparent; }
.spot:hover, .spot:focus-visible { background: rgba(255,248,232,.1); }
@media (hover: none) { .spot:hover { background: transparent; } }   /* (touch screens: no lit box left behind after a tap) */
.spot:focus-visible { outline: 2px solid rgba(255,255,255,.8); outline-offset: -2px; }   /* (for keyboard visitors) */
/* its name: a small crystal tag that follows the mouse (and sits on the button for keyboard visitors) */
.tag { position: fixed; z-index: 6; pointer-events: none; white-space: nowrap; transform: translate(14px, 14px);
  font: 700 11px/1 "Helvetica Neue", Helvetica, Arimo, Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase;
  padding: 8px 12px; border-radius: 3px; }   /* (crystal glass: see above) */

/* --- The page furniture: the way back out, the "Scroll down" cue (at the bottom of the screen), the phone directory --- */
.back { position: fixed; z-index: 5; top: max(10px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  font: 700 10px/1 "Helvetica Neue", Helvetica, Arimo, Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase;
  text-decoration: none; padding: 6px 9px; border-radius: 3px; }   /* (crystal glass: see above) */
.back:hover { background-color: rgba(255,255,255,.12); }
.back:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.cue { position: fixed; z-index: 5; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0;
  display: grid; justify-items: center; gap: 6px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: none;
  font: 700 11px/1 Arimo, "Helvetica Neue", Arial, sans-serif; letter-spacing: .22em; text-transform: uppercase; transition: opacity .4s; }
.cue::after { content: ""; width: 12px; height: 12px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: rotate(45deg); animation: bob 1.6s ease-in-out infinite; }       /* a little arrow under the words, pointing down */
.cue.gone { opacity: 0; }
@media (max-aspect-ratio: 9/10) { .cue { bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 82px); } }   /* phones: just above the directory */
@keyframes bob { 50% { transform: translateY(5px) rotate(45deg); } }

/* The directory: the four places as buttons, for phones only (on a phone some of the room is off to the side).
   A small crystal panel (about a third smaller than it was): four crystal buttons in a 2 x 2 grid. */
.directory { display: none; }
@media (max-aspect-ratio: 9/10) {
  .directory { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; position: fixed; z-index: 5; padding: 5px; border-radius: 6px;
    left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
  .directory button { border: 0; margin: 0; cursor: pointer; padding: 8px 10px; border-radius: 3px; text-align: left; white-space: nowrap;
    font: 700 8px/1 "Helvetica Neue", Helvetica, Arimo, Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase;
    font-variant-emoji: text; }   /* (Nov 1) arrows stay plain white text, never emoji (backs up the &#xFE0E; in the HTML) */
  .directory button:active { background-color: rgba(255,255,255,.3); }
}

/* --- THE POPUPS. Each popup is a <dialog>: the browser's own popup box. It covers the screen, keeps the keyboard
   inside itself while open, and closes with the Escape key all by itself. --- */
dialog.pop { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0;
  background: #0d0d0c; color: #f1ece2; overflow: hidden; overscroll-behavior: contain;
  font-family: Arimo, "Helvetica Neue", Arial, sans-serif; }
dialog.pop[open] { animation: fade-in .35s ease-out; }
@keyframes fade-in { from { opacity: 0; } }
.close { position: fixed; z-index: 3; top: max(8px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
  font: 300 30px/1 "Helvetica Neue", Arial, sans-serif; }   /* (crystal glass: see above) */
.close:hover, .close:focus-visible { outline: none; background-color: rgba(255,255,255,.18); }
.close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* 1 · Newsstand: the real Newsstand page, shown inside the popup (an <iframe> is a window onto another page) */
.pop-newsstand iframe { display: block; width: 100%; height: 100%; border: 0; background: #f4efe6; }
/* (Nov 4) While a magazine is open in there, the Newsstand labels this page "nr-reading" (newsstand.js, markPost) and the
   popup's × steps aside: the magazine's own × sits in the same corner and puts the magazine back first. */
html.nr-reading #pop-newsstand > .close { opacity: 0; pointer-events: none; }

/* 2 · Wishing Wall: the whole wall, as big as the screen allows. Click (or tap) it to zoom in and read; the zoomed
   wall is 3 times bigger and scrolls every way (swipe, or the scroll wheel); click again to see it all. */
.wall-scroll { position: absolute; inset: 0; display: flex; overflow: auto;
  padding: 24px max(24px, env(safe-area-inset-right, 0px)) 48px max(24px, env(safe-area-inset-left, 0px)); }
.wall-scroll img { display: block; margin: auto; width: auto; height: auto; max-width: 100%; max-height: 100%; cursor: zoom-in;
  box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.wall-scroll.zoomed img { max-width: none; max-height: none; cursor: zoom-out; }
.wall-hint { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0;
  font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8d8a86; pointer-events: none; }

/* 3 · NEBULA CAFE (Nov 3): Kathi's photoreal café, through the arch. Like the room, it's a picture you scroll down
   (the café is two storeys), with buttons on it in percent of the picture: the pink neon and the card reader (Buy Me
   a Cosmo) and the WORD JAR. Kathi stands behind the bar (her brass name tag, "Kathi", is baked into the picture)
   and greets you with a "Hi Human" speech bubble.
   Its own crystal panel at the bottom, one row: BUY ME A COSMO | WORD JAR (the same width as the room's directory). */
dialog.pop-cafe { overflow-y: auto; overflow-x: hidden; }
.cafe { --x0: 0; --x1: 1; position: relative; width: 100%; overflow: hidden; aspect-ratio: 2486 / 2532; }
@media (max-aspect-ratio: 9/10) { .cafe { --x0: .2414; --x1: .7241; aspect-ratio: 1200 / 2532; } }   /* phones: the middle slice */
.c-neon   { left: 30.57%; top: 37.12%; width: 32.18%; height: 6.71%; border-radius: 40%; }
.c-jar    { left: 61.54%; top: 76.22%; width: 8.61%;  height: 11.61%; border-radius: 12%; }
.c-reader { left: 67.98%; top: 72.27%; width: 12.87%; height: 13.03%; border-radius: 10%; }
.cafe .spot:hover, .cafe .spot:focus-visible { background: transparent; box-shadow: 0 0 0 2px rgba(255,255,255,.8), 0 0 1.4em rgba(255,214,160,.55); }
.cafe .c-neon:hover, .cafe .c-neon:focus-visible { box-shadow: none; background: radial-gradient(closest-side, rgba(255,92,160,.3), transparent); }
.c-jar svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
/* KATHI: an invisible button over her, from her headphones down to her hands on the counter (it stops at 61% across,
   so it never overlaps the Word Jar at 61.5%). Hovering it makes her say hi; clicking it opens her Substack card
   (PART 3, STEP 8B). Not a ".spot", so it never draws a box around her. */
.c-kathi { position: absolute; left: 35%; top: 42%; width: 26%; height: 42%; margin: 0; padding: 0; border: 0; border-radius: 40% 40% 10% 10%;
  background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.c-kathi:focus-visible { outline: 2px solid rgba(255,255,255,.8); outline-offset: -2px; }
/* "Hi, Human!": Kathi's CONVERSATION BUBBLE. Its tail sits at the bottom-left and points at her, the way a chat app
   shows who's talking. The tail's tip is pinned just off her headphones (left 57%, top 48% of the picture), so it
   stays on her on every screen and scrolls with the café; no JavaScript places it.
   Three layers, stacked in one box 7.4 x 2.8 "em" (em = the bubble's letter size, so it all scales together):
     .hello-glass  the body: crystal glass, a rounded rectangle (it blurs the café behind it, like every crystal button)
     .hello-edge   a drawing (SVG) on top: the tail, its soft shadow, and ONE outline around body and tail, so they read
                   as one bubble (a white hairline brightest at the top, over a faint rainbow: the crystal buttons' light)
     .hello-say    what she says: three "typing" dots, then the words, in the same spot
   (Why not cut the glass itself into a bubble shape? Safari has a bug where glass blur ignores a cut-out shape, so the
   glass stays a plain rounded rectangle and the drawing adds the tail.)
   HOW IT MOVES: one switch, the class "on" (PART 3, STEP 8B). Hidden, the bubble is tiny and tucked into the tail's tip
   (scale .2, growing from transform-origin = the tip), so it grows out of her. On: it springs to full size, the dots
   type for a moment, "Hi, Human!" rises in at 0.85 s, and it floats gently. Off: it shrinks back into her. While it's
   on it can be clicked (pointer-events), which opens her Substack card too. */
.hello { position: absolute; z-index: 1; left: 57%; top: 48%; width: 7.4em; height: 2.8em; margin: 0; pointer-events: none;
  font: 700 clamp(15px, 2vw, 24px)/1 Arimo, Arial, sans-serif; letter-spacing: .02em; color: #fff;
  transform: translateY(-100%) scale(.2); transform-origin: .8% 98.6%;
  transition: transform .3s cubic-bezier(.5, 0, .75, 0) .1s; }   /* leaving: shrinks back into her, after a 0.1 s grace */
.hello-glass { position: absolute; left: 5.405%; top: 0; width: 94.595%; height: 75%; border-radius: .95em;
  background: linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.08) 42%, rgba(255,255,255,.04) 58%, rgba(255,255,255,.2)), rgba(18,16,20,.6);
  -webkit-backdrop-filter: blur(6px) saturate(1.5) brightness(1.08); backdrop-filter: blur(6px) saturate(1.5) brightness(1.08); }
.hello-edge { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.hello-say { position: absolute; left: 5.405%; top: 0; width: 94.595%; height: 75%; display: grid; place-items: center;
  text-shadow: 0 1px 2px rgba(0,0,0,.55); white-space: nowrap; }
.hello-say > * { grid-area: 1 / 1; }   /* the dots and the words share one spot */
.hello-dots { display: flex; gap: .2em; opacity: 0; }
.hello-dots i { width: .26em; height: .26em; border-radius: 50%; background: rgba(255,255,255,.92); }
.hello-words { opacity: 0; transform: translateY(.3em); transition: opacity .15s .1s; }
.hello-glass, .hello-edge, .hello-say { opacity: 0; transition: opacity .2s .1s; }
.hello.on { pointer-events: auto; cursor: pointer; transform: translateY(-100%) scale(1);
  transition: transform .55s cubic-bezier(.2, 1.6, .4, 1);          /* grows with a little spring */
  animation: hello-float 3.6s ease-in-out .7s infinite; }             /* then floats gently */
.hello.on .hello-glass, .hello.on .hello-edge, .hello.on .hello-say { opacity: 1; transition: opacity .2s; }
.hello.on .hello-dots { animation: dots-life 1s forwards; }           /* the dots show, then go at 0.8 s... */
.hello.on .hello-dots i { animation: dot-hop .6s ease-in-out infinite; }
.hello.on .hello-dots i:nth-child(2) { animation-delay: .1s; } .hello.on .hello-dots i:nth-child(3) { animation-delay: .2s; }
.hello.on .hello-words { opacity: 1; transform: none;                 /* ...and the words rise in at 0.85 s */
  transition: opacity .3s .85s, transform .45s cubic-bezier(.2, 1.4, .4, 1) .85s; }
@keyframes hello-float { 50% { translate: 0 -.12em; } }
@keyframes dots-life { 0% { opacity: 0; } 12%, 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes dot-hop { 0%, 60%, 100% { transform: none; opacity: .55; } 30% { transform: translateY(-.16em); opacity: 1; } }
/* the café's panel: one row, 🍸 BUY ME A COSMO | WORD JAR 🫙, the same width as the room's directory, on every screen */
.c-panel { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: 123px 87px; gap: 5px; padding: 5px; border-radius: 6px; }
.c-panel button, .c-panel a { overflow: hidden; border: 0; margin: 0; cursor: pointer; padding: 8px 10px; border-radius: 3px; text-align: left;
  white-space: nowrap; text-decoration: none; color: #fff; font: 700 8px/1 "Helvetica Neue", Helvetica, Arimo, Arial, sans-serif; letter-spacing: .18em;
  text-transform: uppercase; font-variant-emoji: text; transition: background-color .2s; }
.c-panel button:hover, .c-panel a:hover, .c-panel button:focus-visible, .c-panel a:focus-visible { outline: none; background-color: rgba(255,255,255,.18); }
/* the emoji, in the arrows' old places (🍸 before Buy Me A Cosmo, 🫙 after Word Jar): 9px, just taller than the lettering,
   sunk to the line (line-height: 0, so the buttons don't get taller) and softened (a bit see-through, less colourful)
   so they sit quietly in the glass. The emoji is a little wider than the arrow was, so the padding on its side is 8px
   instead of 10px: the buttons keep their exact widths (123px and 87px). */
.c-panel .em { font-size: 9px; line-height: 0; vertical-align: -1px; letter-spacing: 0; font-variant-emoji: emoji;
  opacity: .8; filter: saturate(.55); text-shadow: none; }
.c-panel .em:first-child { margin-right: 2px; } .c-panel .em:last-child { margin-left: 2px; }
.c-panel .c-cosmo { padding-left: 8px; } .c-panel .c-tip { padding-right: 8px; }
.c-cue { position: fixed; z-index: 3; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 52px); transform: translateX(-50%); margin: 0;
  display: grid; justify-items: center; gap: 6px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: none;
  font: 700 11px/1 Arimo, "Helvetica Neue", Arial, sans-serif; letter-spacing: .22em; text-transform: uppercase; transition: opacity .4s; }
.c-cue::after { content: ""; width: 12px; height: 12px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); animation: bob 1.6s ease-in-out infinite; }
.c-cue.gone { opacity: 0; }

/* THE WORD JAR's card: post-it strips, black and white, stuck over the café */
.wj { position: fixed; inset: 0; z-index: 5; overflow-y: auto; display: grid; place-items: center; padding: 64px 16px 24px; background: rgba(6, 6, 8, .62);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }

/* 5 · The poster up close: a copy of the storefront's ("The poster up close" in assets/storefront.css), so the two

dialog.pop-poster, dialog.pop-card { background: rgba(6,6,8,.84); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }

/* 6 · THE CAFÉ'S TWO CARDS (Nov 3): built exactly like the poster up close (dialog.pop-card shares its rules above), so
   every popup in the tiny world behaves the same: the room dimmed and softly blurred behind, the card as big as fits,
   a crystal button under it with a plain white arrow, a small round x on the card's corner. Each card is a miniature of
   Kathi's real page; its button is the only way out of the tiny world.
     .bmc  BUY ME A COSMO: her Buy Me a Coffee page (the black NOT RISING banner, her photo, the page's name)
     .ss   JOIN THE CONVERSATION: her Substack profile (name, handle, photo, bio, her publication Hi, Human)
   --w is the card's width; the banner's letters and the photo are sized from it, so they fit on every screen. */
.bmc, .ss { --w: min(86vw, 400px); width: var(--w); margin: 0; overflow: hidden; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.7); }

  background: #000; color: #ebebeb; white-space: nowrap; letter-spacing: -.01em;
  font: 400 calc(var(--w) * .142)/1 "Archivo Black", "Arial Black", Impact, sans-serif; }

.ss-avatar { flex: none; display: block; width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #ddd; }

dialog.pop-gallery { overflow-y: auto;

    radial-gradient(ellipse 58% 52% at 50% 40%, rgba(255,232,196,.13), rgba(255,232,196,.04) 55%, transparent 75%),

.print { display: block; aspect-ratio: 1; margin: 0; padding: 5px; border: 0; cursor: pointer; background: #070707;

.viewer { position: fixed; inset: 0; display: grid; place-items: center;

/* the label: a printed card behind clear glass, held off the wall by four chrome standoffs.
   (Nov 1) TINY next to the photo, the way a museum's wall label is: the same card, shrunk to half size (zoom), so the
   lettering, line breaks, glass and screws all stay the same, only smaller. --k is that size; change it in one place
   (phones have their own, below). zoom shrinks the label's own margin too, so the margin is divided by --k to still

.label { --k: .5; zoom: var(--k); position: relative; flex: 0 0 auto; margin: 0 0 calc(-7px / var(--k)); }

.v-credit { font-size: 10.5px; line-height: 1.4; color: #666; margin-top: 9px !important; }   /* line 4: whose collection it's in */
.card em { font-style: italic; }
.screw { position: absolute; z-index: 2; width: 7px; height: 7px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #c9ccd0 40%, #7d8287 75%, #4a4e52); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
/* on a phone (Oct 31; label made 2x smaller Nov 1): the gallery's words come in at 3/4 size, so they sit beside the photos in the same proportion
   as on a computer instead of crowding them.
     - the line under LIFE: 9px instead of 12px, its two parts stacked (the title, then the artist), one to a line
     - the label goes under the photo (flush with its right edge) and is the very same card, shrunk to 3/8 (zoom):
       same lettering, same line breaks, same glass and screws, only smaller. --k is that size; change it in one place.
       (zoom shrinks the label's own margin too, so the margin is divided by --k to land at 6px down and 7px out.)
     - the photo gets the room the smaller label frees up: the screen's height minus 230px (it was 290px, and 330px before that)

  .frame img { max-width: calc(100vw - 32px - 28px); max-height: calc(100vh - 230px); max-height: calc(100dvh - 230px); }
  .label { --k: .375; zoom: var(--k); margin: calc(6px / var(--k)) calc(-7px / var(--k)) 0 0; }
  .v-prev, .v-next { top: auto; transform: none; bottom: max(14px, env(safe-area-inset-bottom, 0px)); }

/* --- Coming in through the storefront door, and leaving: a fade from (and to) white light --- */
html.from-light body::after { content: ""; position: fixed; inset: 0; z-index: 2147483647; background: #fff; pointer-events: none; animation: from-light 1.2s ease-out .1s both; }
@keyframes from-light { to { opacity: 0; visibility: hidden; } }
body::before { content: ""; position: fixed; inset: 0; z-index: 2147483646; background: #fff; opacity: 0; pointer-events: none; transition: opacity .6s ease-in; }
body.leaving::before { opacity: 1; }

/* Visitors who ask for less motion get none */
@media (prefers-reduced-motion: reduce) {
  .cue::after, .c-cue::after, dialog.pop[open], .lb-box, html.from-light body::after { animation: none; }

  html.from-light body::after { display: none; }

}

<!-- The words and photo lists (data.js), then PART 3 -->
<script src="../assets/data.js"></script>
<script>
/* ================================================================
   PART 3 · THE BEHAVIOUR
   ================================================================ */
(function () {
  const $ = id => document.getElementById(id);
  const DATA = window.NRPOST || {};
  const IMG = "../assets/img/";
  const room = $("room"), stage = $("stage"), cue = $("cue"), tag = $("tag");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const portrait = () => matchMedia("(max-aspect-ratio: 9/10)").matches;

  /* STEP 1 · THE POSTER UP CLOSE: its picture and the BUY IT link (WALL_POSTER and POSTERS in data.js) */
  const BEST = ((window.NRSF || {}).POSTERS || []).find(p => p.kind === "bestseller");
  if (BEST) { $("lb-buy").href = BEST.link; $("pop-poster").setAttribute("aria-label", BEST.book + " by " + BEST.author); }
  const WP = DATA.WALL_POSTER || {};
  $("lb-poster").dataset.src = IMG + (WP.closeup || WP.img || "post/poster-best-storyteller.webp");
  $("lb-poster").alt = WP.alt || "";
  if (BEST) room.querySelector(".s-poster").dataset.label = BEST.book;

  /* STEP 2 · WHERE YOU LAND, once the picture has arrived (at most 3 seconds): a computer at the top, up under the
     glass roof, with the "Scroll down" cue; a phone with Nebula Cafe in the middle of the screen. */
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  let landedAt = 0;
  function land() {
    let y = 0;
    if (portrait()) {
      const r = room.querySelector(".s-cafe").getBoundingClientRect();
      y = Math.max(0, scrollY + r.top + r.height / 2 - innerHeight / 2);
    }
    scrollTo(0, y); landedAt = scrollY; cueCheck();
  }
  const roomImg = $("room-img");
  const arrived = roomImg.complete ? Promise.resolve() : new Promise(r => { roomImg.onload = roomImg.onerror = r; });
  Promise.race([arrived, new Promise(r => setTimeout(r, 3000))]).then(() => { land(); stage.classList.add("ready"); });

  /* STEP 3 · THE CUE goes once you start looking around (and never shows when there's nothing below to see) */
  function cueCheck() {
    const room_left = document.documentElement.scrollHeight - innerHeight - scrollY;
    if (Math.abs(scrollY - landedAt) > 40 || room_left < 60) cue.classList.add("gone");
  }
  addEventListener("scroll", () => { if (!tag.hidden) tag.hidden = true; cueCheck(); }, { passive: true });

  /* STEP 4 · THE BUTTONS' NAME TAG: follows the mouse over a button; for keyboard visitors it sits on the button */
  const showTag = (text, x, y) => { tag.textContent = text; tag.style.left = x + "px"; tag.style.top = y + "px"; tag.hidden = false; };
  room.addEventListener("pointermove", e => {
    const b = e.target.closest(".spot");
    if (b && e.pointerType === "mouse") showTag(b.dataset.label, e.clientX, e.clientY); else tag.hidden = true;
  });
  room.addEventListener("pointerleave", () => (tag.hidden = true));
  room.addEventListener("focusin", e => { const b = e.target.closest(".spot"); if (!b) return; const r = b.getBoundingClientRect(); showTag(b.dataset.label, r.left + r.width / 2, r.top + r.height / 2); });
  room.addEventListener("focusout", () => (tag.hidden = true));

  /* STEP 6 · OPEN AND CLOSE THE POPUPS: ONE DOOR IN, ONE DOOR OUT
     Every way into a place goes through the same door: the spot on the wall, the phone directory and the poster are
     all buttons with data-pop="name", and ONE listener sends every one of them to openPop(name), which opens the
     <dialog> with id "pop-name". So whether you reach the Gallery from the café, from the door or from the
     directory, you take exactly the same path and arrive at exactly the same place: the top of the exhibit.
     The first time a popup opens, its held-back pictures (data-src) are switched on, which is when they download.
     While it's open the page underneath stays put (.locked), and every way out (the x, Escape, a click on the dark)
     comes back through the same door: you're returned to the very spot in the room you were standing on. */
  let standingAt = 0;                                       // where you were in the room when you stepped into a popup
  function openPop(name) {
    const pop = $("pop-" + name);
    pop.querySelectorAll("source[data-srcset]").forEach(el => { el.srcset = el.dataset.srcset; el.removeAttribute("data-srcset"); });   // (a <picture>'s choices first)
    pop.querySelectorAll("[data-src]").forEach(el => {
      if (el.dataset.srcset) { el.srcset = el.dataset.srcset; el.removeAttribute("data-srcset"); }   // (a picture with two sizes: set the choice first)
      el.src = el.dataset.src; el.removeAttribute("data-src");
    });
    if (name === "gallery") showHang();
    if (name === "cafe") cafeOpened();
    tag.hidden = true;
    standingAt = scrollY;
    document.documentElement.classList.add("locked");
    pop.showModal();
    pop.scrollTop = 0;                                      // every popup opens at its beginning, however you left it last time
  }                                                         // (after it's open: a closed popup has nothing to scroll)
  // (one listener for the whole page: it catches a click on any button with data-pop, in the room or the directory)
  document.addEventListener("click", e => { const b = e.target.closest("[data-pop]"); if (b) openPop(b.dataset.pop); });
  document.querySelectorAll("dialog.pop").forEach(pop => {
    pop.addEventListener("close", () => {
      if (document.querySelector("dialog.pop[open]")) return;   // a card closed over the café: the café is still open, so stay put
      document.documentElement.classList.remove("locked");
      if (scrollY !== standingAt) scrollTo(0, standingAt);  // (back where you stood, even if the browser moved the page meanwhile)
    });
    pop.querySelector(".close").addEventListener("click", () => pop.close());
    // a click on the dark around the picture closes the popup too (data-empty marks those dark areas);
    // in the gallery's viewer it steps back to the whole exhibit first
    pop.addEventListener("click", e => {
      if (e.target !== pop && !e.target.hasAttribute("data-empty")) return;
      if (pop.id === "pop-gallery" && !viewer.hidden) showHang(); else pop.close();
    });
  });

  /* STEP 6B · ZOOMING INTO THE WISHING WALL
     A click (or tap) on the wall makes it 3 times the size it fits at, and scrolls so the spot you clicked stays
     under your finger. Another click shows the whole wall again. */
  const wallBox = document.querySelector(".wall-scroll"), wallImg = $("wall-img"), wallHint = $("wall-hint");
  const tapWord = matchMedia("(pointer: coarse)").matches ? "Tap" : "Click";
  wallHint.textContent = tapWord + " the wall to zoom in";
  wallImg.addEventListener("click", e => {
    const r = wallImg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    const zoom = !wallBox.classList.contains("zoomed");
    if (zoom) { wallImg.style.width = r.width * 3 + "px"; wallImg.style.height = r.height * 3 + "px"; }
    else { wallImg.style.width = wallImg.style.height = ""; }
    wallBox.classList.toggle("zoomed", zoom);
    wallHint.textContent = zoom ? tapWord + " again to see the whole wall" : tapWord + " the wall to zoom in";
    if (zoom) {
      const r2 = wallImg.getBoundingClientRect(), b = wallBox.getBoundingClientRect();
      wallBox.scrollLeft += (r2.left + fx * r2.width) - e.clientX;
      wallBox.scrollTop += (r2.top + fy * r2.height) - e.clientY;
    }
  });
  $("pop-wall").addEventListener("close", () => { wallBox.classList.remove("zoomed"); wallImg.style.width = wallImg.style.height = ""; });

  /* STEP 7 · THE WISHES AS WORDS, for screen readers (the wall itself is a picture) */
  (DATA.WISHES || []).forEach(w => {
    const li = document.createElement("li");
    li.textContent = w.wish.replace(/\*\*/g, "") + " (" + w.name + (w.human === false ? "" : ", " + (w.title || "Human")) + ")";
    $("wishes").appendChild(li);
  });

  /* STEP 8 · THE GALLERY
     The hang: every photo in data.js as a small framed print, in order. Click one and the viewer
     shows it whole, with its label. ‹ › (or the arrow keys, or a swipe) move along; "All photos" or Escape
     goes back to the hang. */
  const G = DATA.GALLERY || [], LABEL = DATA.GALLERY_LABEL || {};
  const hang = $("hang"), viewer = $("viewer");
  let at = 0;
  const plain = t => String(t || "").replace(/\*/g, "");                     // the words without the *italics* stars
  // A label line, with any *starred* words set in italics (every odd piece between the stars is italic).
  // Words in (brackets) stay together on one line, so "(Filipino-American, b. 1986)" never splits at its hyphen.
  function setLine(el, text) {
    el.textContent = "";
    String(text || "").split("*").forEach((part, i) => {
      if (!part) return;
      const box = i % 2 ? el.appendChild(document.createElement("em")) : el;
      part.split(/(\([^)]*\))/).forEach(bit => {
        if (!bit) return;
        if (bit[0] === "(") { const keep = document.createElement("span"); keep.style.whiteSpace = "nowrap"; keep.textContent = bit; box.appendChild(keep); }
        else box.appendChild(document.createTextNode(bit));
      });
    });
  }
  $("g-title").textContent = plain(LABEL.title || "LIFE").split(" ")[0];   // "Life" (shown in capitals)
  // The line under LIFE: the title, a dot, the artist ("Life Exhibit, 2026 · KATHI ERIC DALGUNTAS (…)"). Each part is
  // its own <span>, so on a phone they can stack one to a line, with the dot hidden (see the phone rules in PART 1).
  [plain(LABEL.title), plain(LABEL.artist)].filter(Boolean).forEach((t, i) => {
    if (i) { const dot = document.createElement("span"); dot.className = "g-dot"; dot.textContent = " · "; $("g-sub").appendChild(dot); }
    const part = document.createElement("span"); part.textContent = t; $("g-sub").appendChild(part);
  });
  G.forEach((p, i) => {
    const print = document.createElement("button");
    print.className = "print"; print.type = "button";
    print.setAttribute("aria-label", "Photo " + (i + 1) + ": " + (p.alt || ""));
    const img = document.createElement("img");
    img.alt = "";
    img.dataset.src = IMG + (p.thumb || p.img.replace(/[^/]+$/, "wall/$&"));   // the small copy (same name, in wall/); the big one loads in the viewer
    if (p.crop) img.style.objectPosition = p.crop;                               // which part of the photo the square keeps
    print.appendChild(img);
    print.addEventListener("click", () => show(i));
    $("grid").appendChild(print);
  });
  // Back to the whole exhibit. Coming back from the viewer (All photos, Escape, a click on the dark) you land on the
  // print you were just looking at, scrolled into view, however you got there.
  function showHang() {
    viewer.hidden = true; hang.hidden = false;
    const print = $("grid").children[at];
    if (print && $("pop-gallery").open) { print.scrollIntoView({ block: "nearest" }); print.focus({ preventScroll: true }); }
  }
  function show(i) {
    at = (i + G.length) % G.length;                                  // wrap around: after the last comes the first
    const p = G[at], L = Object.assign({}, LABEL, p);                // the shared label, with this photo's own words on top
    const img = $("v-img");
    img.src = IMG + p.img; img.alt = p.alt || ""; img.style.aspectRatio = String(p.ar || 1);
    setLine($("v-artist"), L.artist);
    setLine($("v-title"), L.title);
    setLine($("v-medium"), L.medium);
    setLine($("v-credit"), L.credit);
    $("v-count").textContent = String(at + 1).padStart(2, "0") + " / " + String(G.length).padStart(2, "0");
    if (viewer.hidden) { hang.hidden = true; viewer.hidden = false; $("v-next").focus({ preventScroll: true }); }
    [at + 1, at - 1].forEach(j => { new Image().src = IMG + G[(j + G.length) % G.length].img; });   // fetch the neighbours early
  }
  $("v-prev").addEventListener("click", () => show(at - 1));
  $("v-next").addEventListener("click", () => show(at + 1));
  $("v-all").addEventListener("click", showHang);
  const gallery = $("pop-gallery");
  gallery.addEventListener("keydown", e => {
    if (viewer.hidden) return;
    if (e.key === "ArrowRight") show(at + 1);
    if (e.key === "ArrowLeft") show(at - 1);
  });
  gallery.addEventListener("cancel", e => { if (!viewer.hidden) { e.preventDefault(); showHang(); } });   // Escape: back to the hang first
  let startX = null;                                                 // a swipe: where the finger went down vs. where it came up
  viewer.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, { passive: true });
  viewer.addEventListener("touchend", e => {
    if (startX == null) return;
    const dx = e.changedTouches[0].clientX - startX; startX = null;
    if (Math.abs(dx) > 45) show(at + (dx < 0 ? 1 : -1));
  }, { passive: true });

  /* STEP 8B · NEBULA CAFE
     HI, HUMAN: Kathi's conversation bubble. PART 1 draws and animates it; all this does is flip one switch, the class
     "on", for everyone:
       - a mouse: on while it's over Kathi (or her bubble), off when it leaves them both
       - a finger (phones have no hover): the first tap on Kathi says hi for 3.5 seconds
       - the keyboard: on while Kathi's button has the focus (Tab to her)
     JOIN THE CONVERSATION: a click on Kathi or her bubble opens her Substack card (on a phone: a tap while she's saying
     hi), through the same door as every popup, openPop("convo"). BUY ME A COSMO (the panel button, the pink neon, the
     card reader) is a data-pop button, so the page's one listener in STEP 6 opens its card, openPop("cosmo").
     The "Scroll down" cue goes once you start looking down. */
  const popCafe = $("pop-cafe"), hello = $("hello"), kathi = $("c-kathi"), cCue = $("c-cue");
  const hasMouse = matchMedia("(hover: hover)");
  let helloTimer = 0;
  function greet(on) { clearTimeout(helloTimer); hello.classList.toggle("on", on); }
  function hoverOff(e) { if (e.pointerType === "mouse" && !kathi.contains(e.relatedTarget) && !hello.contains(e.relatedTarget)) greet(false); }
  kathi.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") greet(true); });
  kathi.addEventListener("pointerleave", hoverOff);
  hello.addEventListener("pointerleave", hoverOff);          // (moving from Kathi onto her bubble keeps it on)
  // the keyboard: only a keyboard's focus switches it (a tap focuses the button too, and must not switch it off again)
  let byKeyboard = false;
  kathi.addEventListener("focus", () => { byKeyboard = kathi.matches(":focus-visible"); if (byKeyboard) greet(true); });
  kathi.addEventListener("blur", () => {
    if (!byKeyboard) return;
    byKeyboard = false;
    helloTimer = setTimeout(() => greet(false), 300);       // (a moment's grace, so a click on the bubble still lands)
  });
  kathi.addEventListener("click", () => {
    if (hasMouse.matches || hello.classList.contains("on")) { openPop("convo"); return; }
    greet(true);
    helloTimer = setTimeout(() => greet(false), 3500);
  });
  hello.addEventListener("click", () => openPop("convo"));
  function cafeCue() { cCue.classList.toggle("gone", popCafe.scrollTop > 40 || popCafe.scrollHeight - popCafe.clientHeight < 60); }
  popCafe.addEventListener("scroll", cafeCue, { passive: true });
  function cafeOpened() { askJar(); cCue.classList.remove("gone"); setTimeout(cafeCue, 400); greet(false); }
  popCafe.addEventListener("close", () => { greet(false); closeJar(); });
  // Escape: closes the Word Jar card first, and only then leaves the café
  popCafe.addEventListener("cancel", e => { if (!wj.hidden) { e.preventDefault(); closeJar(); } });

  /* THE WORD JAR: a name and at most five kind words, on a post-it strip that drops into the jar on the counter.
     ONE JAR FOR EVERYONE: the strips live in Kathi's "Word Jar" Google Sheet, behind a small script (word-jar.gs,
     kept in her Google account) with two doors. JAR_URL is that script's address. It is safe to have in the page:
     it holds no key, and it can only do two things: take in a strip, or hand out the strips Kathi has ticked "Show".
       - the way OUT (askJar): the first time the café opens, the page asks for the ticked strips
       - the way IN (sendStrip): a dropped strip goes to the sheet as a new row, unticked until Kathi approves it
     The visitor's own strips are also kept in their own browser (localStorage), so a strip drops into the jar the
     moment they tip, before it's approved. The jar shows everyone's ticked strips plus the visitor's own, each strip
     once, newest 52 (all the jar on the counter holds). If Google can't be reached, the jar shows the visitor's own. */
  const MAX_WORDS = 5, KEY = "nr-word-jar", JAR_HOLDS = 52;
  const JAR_URL = "https://script.google.com/macros/s/AKfycbx6K9_n_b6VWF5DsRyXl1kkKiY9q1CWcNeNi7XUMRtfM8LtOFU6KAwWpNzcNu_8ByP06w/exec";
  let shared = [], askedJar = false;                         // everyone's approved strips, once they've arrived
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } };
  const save = list => { try { localStorage.setItem(KEY, JSON.stringify(list.slice(-40))); } catch (e) {} };
  function inJar() {                                         // everyone's strips, then this visitor's own that aren't among them yet
    const seen = new Set(shared.map(s => s.name + "|" + s.words));
    return shared.concat(load().filter(s => !seen.has(s.name + "|" + s.words))).slice(-JAR_HOLDS);
  }
  function askJar() {                                        // the way OUT, once per visit
    if (askedJar) return;
    askedJar = true;
    fetch(JAR_URL).then(r => r.json())
      .then(d => { if (d && d.ok && Array.isArray(d.strips)) { shared = d.strips; drawJar(); } })
      .catch(() => {});                                      // (no answer: the jar keeps showing the visitor's own strips)
  }
  function sendStrip(strip) {                                // the way IN
    // sent as plain text, which browsers send straight to Google; any other kind would first need a permission check
    // that Google's scripts don't answer
    fetch(JAR_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(strip) })
      .catch(() => {});                                      // (the strip is already in this visitor's own jar either way)
  }
  function seeded(n) { const x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); }
  function drawJar() {   // white and black strips by turns, piled from the bottom (the jar's inside: x 772-867, y 984-1106)
    const g = $("jar-strips"), NS = "http://www.w3.org/2000/svg"; g.textContent = "";
    inJar().forEach((_, i) => {
      const level = 1101 - Math.floor(i / 4) * 9 - seeded(i) * 4, x = 772 + seeded(i + 99) * 78, a = (seeded(i + 7) - .5) * 60;
      const r = document.createElementNS(NS, "rect");
      r.setAttribute("x", x.toFixed(1)); r.setAttribute("y", (level - 2.5).toFixed(1)); r.setAttribute("width", 17); r.setAttribute("height", 4.6);
      r.setAttribute("fill", i % 2 ? "#1b1918" : "#f3eee4"); r.setAttribute("stroke", i % 2 ? "#000" : "#bfb5a3"); r.setAttribute("stroke-width", ".4");
      r.setAttribute("transform", `rotate(${a.toFixed(1)} ${(x + 8.5).toFixed(1)} ${level.toFixed(1)})`);
      g.appendChild(r);
    });
  }
  drawJar();
  const wj = $("wj"), msg = $("wj-msg");
  function openJar() { wj.hidden = false; msg.textContent = ""; msg.classList.remove("err"); setTimeout(() => $("wj-name").focus(), 50); }
  function closeJar() { wj.hidden = true; }
  popCafe.querySelectorAll("[data-jar]").forEach(j => j.addEventListener("click", openJar));
  $("wj-x").addEventListener("click", closeJar);
  wj.addEventListener("click", e => { if (e.target === wj) closeJar(); });
  const words = () => $("wj-words").value.trim().split(/\s+/).filter(Boolean);
  $("wj-words").addEventListener("input", () => { const n = words().length, c = $("wj-count"); c.textContent = `${n} of ${MAX_WORDS} words`; c.classList.toggle("over", n > MAX_WORDS); });
  $("wj-form").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("wj-name").value.trim().replace(/\s+/g, " "), w = words();
    let problem = "";
    if (!name) problem = "Add your name to the strip.";
    else if (!w.length) problem = "Add a kind word or two.";
    else if (w.length > MAX_WORDS) problem = "Five words at most. Keep it short and kind.";
    else if (/https?:|www\.|\.(com|net|org|io|co)\b|@/i.test(name + " " + w.join(" "))) problem = "No links or handles on the strip, just kind words.";
    msg.classList.toggle("err", !!problem);
    if (problem) { msg.textContent = problem; return; }
    save(load().concat({ name, words: w.join(" "), at: Date.now() })); drawJar();          // into this visitor's own jar, right away
    sendStrip({ name, words: w.join(" "), website: $("wj-site").value });                // and on to the sheet, for Kathi to approve
    msg.textContent = `Thank you, ${name}. Your strip is in the jar.`;
    $("wj-words").value = ""; $("wj-count").textContent = `0 of ${MAX_WORDS} words`;
  });

  /* STEP 9 · LEAVING: back out to Daydream St. through white light (the storefront fades in from it) */
  document.querySelector(".back").addEventListener("click", e => {
    if (reduceMotion) return;
    e.preventDefault();
    const href = e.currentTarget.href;
    document.body.classList.add("leaving");
    try { sessionStorage.setItem("nr-light", "1"); } catch (err) {}
    setTimeout(() => (location.href = href), 600);
  });
  addEventListener("pageshow", () => document.body.classList.remove("leaving"));   // coming back with the Back button
})();
</script>
</body>
</html>
