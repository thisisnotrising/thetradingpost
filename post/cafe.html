<!--
  NOT RISING · THE POST, the room inside 777 Daydream St.
  ------------------------------------------------------------------
  THE BIG IDEA: A STAGE SET
  The room is a real 3D box, exactly like the original: walls, floor and a
  glass roof, tilted into place, with a camera that comes down through the
  room as you scroll. But every surface, and everything standing in the
  room, is ONE finished picture. Nothing is painted while the visitor
  waits; the browser holds the pictures up in 3D and moves the camera.
  Four invisible buttons sit on the walls (Newsstand, Wishing Wall, Cafe,
  Gallery); each one opens a popup.

  THIS FILE HAS THREE PARTS
    PART 1 · THE LOOK       (CSS, in the <style> below): the box, the camera, the buttons, the popups
    PART 2 · THE BONES      (HTML, in the <body>): an empty stage, the cue, the 5 popups
    PART 3 · THE BEHAVIOUR  (JavaScript, at the bottom): size the room, put up the set, move the camera,
                            open and close popups, the gallery

  WHERE THINGS COME FROM
    The set: assets/post-stage.js (the list of pictures and where each stands, in metres) and
      assets/img/post/stage/ (the pictures). Both are made by tools/bake-stage.js, which photographs
      post/recipe.html, the live room. To change the room: change the recipe, then re-bake.
    The Wishing Wall and café close-ups: assets/img/post/room/ (tools/bake-post.js)
    The gallery's photos and label, and the wishes' words: assets/data.js, PART 3
    The big poster on the black wall: WALL_POSTER in assets/data.js (where it hangs) and assets/img/post/
      poster-best-storyteller*.webp (the pictures, made by tools/render-poster.js). It's hung live (PART 3, step 2B),
      not baked, so a re-bake doesn't touch it. Click it and it opens up close with a BUY IT button (popup 5), the
      same as the poster in the storefront window; the book, author and shop link come from POSTERS in data.js.
    THE FINAL STAGE (every screen, Oct 31): assets/post-final.js. The same room and camera, but the whole room (fan and
      benches too) is drawn by the graphics chip as one flat picture on one canvas, redrawn in 3D as you scroll,
      instead of ~60 pictures held up in 3D by the browser (which made phones crash, and made computers flicker, blank
      out and stutter). The room in front keeps only its invisible buttons. Add ?final=0 to the address to see the
      old held-up-in-3D version (it's also the backup for a browser that can't draw on the graphics chip).
  ------------------------------------------------------------------
-->
<style>
/* ================================================================
   PART 1 · THE LOOK
   ================================================================ */

/* --- The page itself: black behind everything. The page scrolls up and down only, never sideways: how far it
   scrolls is how far the camera comes down through the room. While a popup is open it stays put (.locked). --- */
html { box-sizing: border-box; overflow-x: hidden; } *, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; background: #0d0d0e; }
/* (Oct 31) No rubber-band bounce past the top or bottom (it showed black above the roof and below the floor) */
html, body { overscroll-behavior: none; }
/* (Oct 31) The ceiling fan holds still. Spinning right in front of the camera it swept big black blades across the
   view, and it made the browser re-sort the whole room every frame, which is what stuttered. */
.nrp-fan-spin { animation: none !important; }
html.locked, html.locked body { overflow: hidden; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }   /* read aloud by screen readers, not shown */

/* --- THE STAGE ---
   .stage  as tall as the room (--PH): that's what gives the page something to scroll
   .scene  the camera, pinned to the screen. "perspective" is how far your eye is from the screen (--P);
           perspective-origin 50% 50% = looking straight ahead, at the middle of the screen
   .room   the box, kept in real 3D (preserve-3d). As you scroll, PART 3 slides it up past the camera by exactly the
           distance scrolled: what a camera coming down a staircase sees. Far things (Nebula) barely move; the walls by
           the door sweep past. That difference in speed is the parallax that makes it feel like coming down.
   The sizes are set by PART 3, step 1, in pixels: --u one metre, --W the screen's width, --Wr the room's width,
   --D its depth, --PH its height, --DN the near floor slab, --P the camera's distance, --walk the walk-in. */
.stage { position: relative; height: var(--PH, 200vh); }
.stage:not(.ready) .scene { opacity: 0; }                    /* hidden until its pictures have arrived... */
.stage.ready .scene { opacity: 1; transition: opacity .5s; } /* ...then it fades in */
/* (Oct 31) The camera's height is the screen's TALLEST height (100lvh: a phone's screen with its address bar tucked
   away), so it never changes size as the bar slides in and out while you scroll; that resize used to make the room
   jump and the picture blank for a moment. On a computer it's simply the window's height. */
.scene { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; overflow: hidden; perspective: var(--P); perspective-origin: 50% 50%; }
.room { position: absolute; top: 0; left: calc((var(--W) - var(--Wr)) / 2); width: var(--Wr); height: var(--PH);
  transform-style: preserve-3d; will-change: translate; pointer-events: none; }
/* walking in: the room starts a step further away and comes toward you */
.walk-in .room { animation: walk-in 1.8s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes walk-in { from { transform: translateZ(var(--walk)); } }

/* THE SIDES OF THE BOX: each a flat panel, tilted into place, exactly as in the original room.
   The back wall is pushed straight back; the left wall is hinged on its left edge and swung 90° to run from the door
   to the café; the right wall is hinged on its right edge and swung the other way; the floor is laid in two slabs,
   each hinged on its front edge and tipped back flat. Each side holds its picture(s) (the <img>s inside it). */
.wall, .panel { position: absolute; overflow: hidden; }
.wall > img, .panel > img, .piece { position: absolute; display: block; max-width: none; }
/* THE FINAL STAGE (every screen: assets/post-final.js). The canvas fills the camera's view, behind the room, and
   everything in the room is drawn on it. The room in front keeps only what has to answer to a click: the buttons
   (invisible, each on its own layer so nothing is painted) and the poster's button. */
.final-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.final .wall > .spot, .final .wall > .poster { transform: translateZ(0); }
.final .poster { background: none; box-shadow: none; }
/* (Oct 31: the iPhone crash) On iPhones and iPads, every picture on a wall, the roof slopes and the floor is lifted
   onto its own layer (translateZ(0) = "give it its own sheet of glass"), and so are the buttons and the poster, so the
   walls themselves have nothing left to paint but their plain colour. Why: an iPhone's browser keeps a fully painted
   copy of every tilted surface that has anything painted on it, at 3 pixels per point. For this room that came to
   over half a gigabyte, and the page crashed. A picture on its own layer is simply shown as it is, at no extra cost.
   (Only there: Chrome and Android work the other way round and would use MORE memory. -webkit-touch-callout is
   something only iPhone and iPad browsers understand, so @supports picks them out.) */
@supports (-webkit-touch-callout: none) {
  .wall > img, .panel > img, .wall > .spot, .wall > .poster { transform: translateZ(0); }
}
.w-back { left: 0; top: 0; width: var(--Wr); height: var(--PH); transform: translateZ(calc(var(--D) * -1)); background: #141414; }
.w-left { left: 0; top: 0; width: var(--D); height: var(--PH); transform-origin: 0 50%; transform: rotateY(90deg); background: #e8e4dc; }
.w-right { left: calc(var(--Wr) - var(--D)); top: 0; width: var(--D); height: var(--PH); transform-origin: 100% 50%; transform: rotateY(-90deg); background: #141414; }
.w-floor { left: 0; top: calc(var(--PH) - var(--D)); width: var(--Wr); height: calc(var(--D) - var(--DN)); transform-origin: 50% 100%;
  transform: translate3d(0, var(--DN), calc(var(--DN) * -1)) rotateX(90deg); background-color: #0b0b0c; }
.w-floor-near { left: 0; top: calc(var(--PH) - var(--DN)); width: var(--Wr); height: var(--DN); transform-origin: 50% 100%; transform: rotateX(90deg); background-color: #0b0b0c; }

/* --- THE POSTER ON THE BLACK WALL (Oct 31): the storefront's #1 BEST STORYTELLER poster, blown up and hung on the
   blank black brick behind the lounge. PART 3 (step 2) sizes it and puts it on the right-hand wall, from WALL_POSTER
   in data.js. It sits flat on the wall, so it moves in 3D with the wall, and the sofa, the pink plant and the
   Edison bulbs stand in front of it.
     .poster        a thin black frame (like the Gallery's canvases, with the same hairline edge) and a soft
                    shadow on the brick, so it reads as hung and not painted on
     .poster img    the poster itself, filling the frame
     .poster-ivy    the wall's ivy, carried on over the poster's top edge, so the strands drape over it instead of
                    being cut off by it (it fades out just above the lettering, so the words stay clear)
     .poster-light  the room's own light laid over it, so it sits in the room instead of glowing like a screen:
                    the same shading the wall has (darker toward the floor and the ceiling, a warm wash from the glass
                    at the back) and the warm light of the Edison bulbs. PART 3 lines these up with the wall, so they
                    carry on across the poster exactly where they fall on the brick. --- */
.poster { position: absolute; padding: calc(var(--u) * .05); background: #0a0a0a;
  box-shadow: 0 0 0 calc(var(--u) * .012) #3a3a3a, 0 calc(var(--u) * .04) calc(var(--u) * .14) rgba(0,0,0,.85); }
.poster img { position: static; display: block; width: 100%; height: 100%; }
.poster-ivy, .poster-light { position: absolute; inset: 0; pointer-events: none; background-repeat: no-repeat; }
/* The poster is a button too (Oct 31): click it and it opens up close with a BUY IT button (popup 5), exactly like
   the poster in the storefront window. pointer-events: auto = it answers to the mouse, like the four spots.
   On hover (or keyboard focus) it brightens a touch, so it reads as something you can pick up. */
button.poster { margin: 0; border: 0; font: inherit; color: inherit; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
button.poster img { transition: filter .3s; }
button.poster:hover img, button.poster:focus-visible img { filter: brightness(1.1); }
button.poster:focus-visible { outline: calc(var(--u) * .03) solid rgba(255,255,255,.8); outline-offset: calc(var(--u) * .02); }

/* --- The light in the room, laid over the screen (so it stays put while you scroll), the same as the original:
   soft sunbeams from the glass roof, then a warm tint and a gentle vignette. Clicks go straight through. --- */
.sun { position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 46% 40% at 44% 30%, rgba(255,250,232,.2), transparent 70%),
    linear-gradient(108deg, transparent 34%, rgba(255,247,226,.09) 38%, transparent 44%, transparent 50%, rgba(255,247,226,.06) 55%, transparent 61%, transparent 66%, rgba(255,247,226,.05) 70%, transparent 75%); }
.air { position: fixed; inset: 0; pointer-events: none; opacity: .9;
  background: radial-gradient(ellipse 80% 70% at 50% 50%, rgba(0,0,0,0) 60%, rgba(20,12,6,.22)), linear-gradient(rgba(255,236,200,.12), rgba(255,236,200,.12)); }

/* --- CRYSTAL GLASS: the look of every button and label that floats over the room (the four spots' name tags,
   the way back out, the phone directory, the popups' close buttons). Clear and see-through, like cut crystal:
     - the room behind shows through, blurred and a little brighter (backdrop-filter)
     - a faint white wash, brighter at the top-left facet (the first gradient)
     - a hairline of light around the edge and a brighter line along the top (the inset box-shadows)
     - a faint rainbow at the edge, the way crystal splits light (the ::before layer, a thin ring of colour)
   White lettering with a soft dark shadow, so it reads over light and dark parts of the room alike. --- */
.crystal { position: relative; isolation: isolate; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.55);
  background: linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.08) 42%, rgba(255,255,255,.04) 58%, rgba(255,255,255,.2));
  -webkit-backdrop-filter: blur(6px) saturate(1.5) brightness(1.08); backdrop-filter: blur(6px) saturate(1.5) brightness(1.08);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.2),
    0 4px 14px rgba(0,0,0,.28); }
.crystal::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(115deg, rgba(255,120,170,.55), rgba(255,220,120,.5) 25%, rgba(120,255,200,.45) 50%, rgba(120,170,255,.55) 75%, rgba(220,140,255,.5));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: .7; }

/* --- THE FOUR BUTTONS: invisible patches stuck onto the walls (inside the 3D walls, so they move with the room).
   pointer-events: auto = they answer to the mouse, though the room around them doesn't. A faint glow on hover. --- */
.spot { position: absolute; display: block; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer;
  pointer-events: auto; transition: background .3s; -webkit-tap-highlight-color: transparent; }
.spot:hover, .spot:focus-visible { background: rgba(255,248,232,.1); }
@media (hover: none) { .spot:hover { background: transparent; } }   /* (touch screens: no lit box left behind after a tap) */
.spot:focus-visible { outline: calc(var(--u) * .03) solid rgba(255,255,255,.8); outline-offset: calc(var(--u) * -.03); }   /* (for keyboard visitors) */
/* its name: a small crystal tag that follows the mouse (and sits on the button for keyboard visitors) */
.tag { position: fixed; z-index: 6; pointer-events: none; white-space: nowrap; transform: translate(14px, 14px);
  font: 700 11px/1 "Helvetica Neue", Helvetica, Arimo, Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase;
  padding: 8px 12px; border-radius: 3px; }   /* (crystal glass: see above) */

/* --- The page furniture: the way back out, the "Scroll down" cue (at the bottom of the screen), the phone directory --- */
.back { position: fixed; z-index: 5; top: max(10px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  font: 700 10px/1 "Helvetica Neue", Helvetica, Arimo, Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase;
  text-decoration: none; padding: 6px 9px; border-radius: 3px; }   /* (crystal glass: see above) */
.back:hover { background-color: rgba(255,255,255,.12); }
.back:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.cue { position: fixed; z-index: 5; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0;
  display: grid; justify-items: center; gap: 6px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: none;
  font: 700 11px/1 Arimo, "Helvetica Neue", Arial, sans-serif; letter-spacing: .22em; text-transform: uppercase; transition: opacity .4s; }
.cue::after { content: ""; width: 12px; height: 12px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: rotate(45deg); animation: bob 1.6s ease-in-out infinite; }       /* a little arrow under the words, pointing down */
.cue.gone { opacity: 0; }
@media (max-aspect-ratio: 9/10) { .cue { bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 82px); } }   /* phones: just above the directory */
@keyframes bob { 50% { transform: translateY(5px) rotate(45deg); } }

/* The directory: the four places as buttons, for phones only (on a phone some of the room is off to the side).
   A small crystal panel (about a third smaller than it was): four crystal buttons in a 2 x 2 grid. */
.directory { display: none; }
@media (max-aspect-ratio: 9/10) {
  .directory { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; position: fixed; z-index: 5; padding: 5px; border-radius: 6px;
    left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
  .directory button { border: 0; margin: 0; cursor: pointer; padding: 8px 10px; border-radius: 3px; text-align: left; white-space: nowrap;
    font: 700 8px/1 "Helvetica Neue", Helvetica, Arimo, Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
  .directory button:active { background-color: rgba(255,255,255,.3); }
}

/* --- THE POPUPS. Each popup is a <dialog>: the browser's own popup box. It covers the screen, keeps the keyboard
   inside itself while open, and closes with the Escape key all by itself. --- */
dialog.pop { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0;
  background: #0d0d0c; color: #f1ece2; overflow: hidden; overscroll-behavior: contain;
  font-family: Arimo, "Helvetica Neue", Arial, sans-serif; }
dialog.pop[open] { animation: fade-in .35s ease-out; }
@keyframes fade-in { from { opacity: 0; } }
.close { position: fixed; z-index: 3; top: max(8px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
  font: 300 30px/1 "Helvetica Neue", Arial, sans-serif; }   /* (crystal glass: see above) */
.close:hover, .close:focus-visible { outline: none; background-color: rgba(255,255,255,.18); }
.close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* 1 · Newsstand: the real Newsstand page, shown inside the popup (an <iframe> is a window onto another page) */
.pop-newsstand iframe { display: block; width: 100%; height: 100%; border: 0; background: #f4efe6; }

/* 2 · Wishing Wall: the whole wall, as big as the screen allows. Click (or tap) it to zoom in and read; the zoomed
   wall is 3 times bigger and scrolls every way (swipe, or the scroll wheel); click again to see it all. */
.wall-scroll { position: absolute; inset: 0; display: flex; overflow: auto;
  padding: 24px max(24px, env(safe-area-inset-right, 0px)) 48px max(24px, env(safe-area-inset-left, 0px)); }
.wall-scroll img { display: block; margin: auto; width: auto; height: auto; max-width: 100%; max-height: 100%; cursor: zoom-in;
  box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.wall-scroll.zoomed img { max-width: none; max-height: none; cursor: zoom-out; }
.wall-hint { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0;
  font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8d8a86; pointer-events: none; }

/* 3 · Cafe: the Nebula close-up, as big as fits, cut to the arch wall so the black wall and its ivy are the frame.
   The pink neon on it (buy me a cosmo) is the link to Kathi's Buy Me a Coffee page. */
dialog.pop-cafe[open] { display: grid; place-items: center; align-content: center; gap: 12px; padding: 56px 16px 20px; }
.cafe { position: relative; margin: 0; width: min(100%, calc((100vh - 110px) * 1400 / 1577)); width: min(100%, calc((100svh - 110px) * 1400 / 1577)); }
.cafe img { display: block; width: 100%; height: auto; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.neon { position: absolute; display: block; border-radius: 40%; color: transparent; font-size: 1px; transition: background .3s; }
.neon:hover, .neon:focus-visible { outline: none; background: radial-gradient(closest-side, rgba(255,90,150,.35), transparent); }
.cafe-hint { margin: 0; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8d8a86; text-align: center; }
.cafe-hint a { color: #f1ece2; }

/* 5 · The poster up close: a copy of the storefront's ("The poster up close" in assets/storefront.css), so the two
   posters behave the same: the room dimmed and softly blurred behind, the poster as big as fits, a BUY IT button
   under it, and a small round x on the poster's top corner.
     .lb-box     the poster and its button, stacked and centred, 20px apart; it pops in, growing slightly
     .lb-poster  as big as fits: 86% of the screen's width, or short enough to leave room for the button
                 (.784 = the poster's shape, 864 / 1102), and never over 560px wide
     .lb-buy     the button: cream with black letters; with a mouse over it (or keyboard focus) it turns to an outline */
dialog.pop-poster { background: rgba(6,6,8,.84); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
dialog.pop-poster[open] { display: grid; place-items: center; padding: 16px; }
.lb-box { position: relative; display: grid; justify-items: center; gap: 20px; outline: none; animation: lb-pop .35s cubic-bezier(.2,.7,.2,1); }
@keyframes lb-pop { from { opacity: 0; scale: .92; } }
.lb-poster { display: block; width: min(86vw, calc((100vh - 150px) * .784), 560px); height: auto; aspect-ratio: 864 / 1102;

<script>
/* ================================================================
   PART 3 · THE BEHAVIOUR
   ================================================================ */
(function () {
  const $ = id => document.getElementById(id);
  const DATA = window.NRPOST || {};
  const IMG = "../assets/img/";
  const room = $("room"), stage = $("stage"), cue = $("cue"), tag = $("tag");
  const STAGE = window.NRSTAGE, SET_BASE = IMG + "post/stage/";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let S = null, setName = "", SIZE = {};   // SIZE: this screen's room, in pixels

  /* THE FINAL STAGE OR THE STAGE SET?
     Every screen gets the final stage (assets/post-final.js): the whole room, fan and benches included, drawn as one
     flat picture on one canvas, redrawn in 3D as you scroll. (Oct 31: computers used to get the stage set, ~60
     pictures held up in 3D by the browser, and scrolling it flickered, blanked out parts and stuttered in Chrome.)
     The stage set stays as the backup, for a browser with no graphics chip to draw with (very rare), or add
     ?final=0 to the address to see it. */
  const ask = location.search;
  const wantFinal = !/[?&]final=0/.test(ask);
  const FINAL = wantFinal && window.NRFINAL && NRFINAL.supported() ? NRFINAL.create($("final"), document.querySelector(".scene")) : null;
  if (FINAL) { $("final").hidden = false; stage.classList.add("final"); }
  let finalReady = Promise.resolve(), posterLook = null;

  /* STEP 1 · SIZE THE ROOM FOR THIS SCREEN (the same rules as the original room)
     A phone (any screen taller than it is wide) gets the NARROW set: a corridor 4.2 m wide and 17 m deep.
     Everything else gets the WIDE set: 6.4 m wide, 13.5 m deep. The room is 7.2 m tall (two storeys).
       u  = how many pixels make one metre. The room is 2 screens tall (2.2 on a phone), so u = 2 x screen height / 7.2.
            (On a very wide screen it's sized by the width instead, so the room always spans the screen.)
       P  = how far the camera is from the screen: 0.9 x its width (on a phone, a little further back)
     Nothing is ever wider than the screen: the room's sides run off its edges, the way they did in the original. */
  function measure() {
    // (H is the camera's own height, not the window's: on a phone the camera is as tall as the screen with the
    //  address bar tucked away, so it doesn't change size, and the room doesn't jump, as the bar slides in and out)
    const W = innerWidth, H = document.querySelector(".scene").clientHeight || innerHeight;
    setName = W / H < .9 ? "narrow" : "wide";
    S = STAGE[setName];
    const R = S.room, narrow = setName === "narrow";
    const u = narrow ? 2.2 * H / R.HM : Math.max(2 * H / R.HM, W / R.Wm);
    const P = narrow ? Math.max(W * 1.9, H * .95) : W * .9;
    SIZE = { W, H, u, P, D: R.Dm * u, PH: R.HM * u };
    const css = stage.style;
    css.setProperty("--u", u + "px");          css.setProperty("--W", W + "px");
    css.setProperty("--Wr", R.Wm * u + "px");  css.setProperty("--D", SIZE.D + "px");
    css.setProperty("--PH", SIZE.PH + "px");      css.setProperty("--DN", R.DNm * u + "px");
    css.setProperty("--P", P + "px");          css.setProperty("--walk", -1.6 * u + "px");
    if (FINAL) FINAL.setCamera(P);
  }

  /* STEP 2 · PUT UP THE SET
     Reads the list in assets/post-stage.js and builds the room from it:
       walls   each side of the box gets its picture(s), laid on it in metres, and its buttons
       pieces  the two glass roof slopes (panels, tilted like the walls) and every picture standing in the room,
               each pushed back to its own depth (translateZ) so the camera sees it in perspective
       live    the ceiling fan and the benches (little 3D objects with their own look)
     m(1.5) is "1.5 metres" written for CSS: calc(var(--u) * 1.5). */
  const m = v => `calc(var(--u) * ${v})`;
  function picture(b, cls) {
    const i = new Image(); i.alt = ""; i.decoding = "async"; i.draggable = false; if (cls) i.className = cls;
    if (FINAL) i.dataset.gl = SET_BASE + b.img;          // (the final stage: just the box; post-final.js draws the picture)
    else i.src = SET_BASE + b.img;
    Object.assign(i.style, { left: m(b.x), top: m(b.y), width: m(b.w), height: m(b.h) });
    return i;
  }
  function button(h) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "spot"; b.dataset.pop = h.pop; b.dataset.label = h.label;
    b.setAttribute("aria-label", "Open the " + h.label);
    const [x, y, w, hh] = h.box;
    Object.assign(b.style, { left: m(x), top: m(y), width: m(w), height: m(hh) });
    return b;
  }
  /* THE FLOOR'S SPARKLE (Oct 31): one small picture (post/obsidian-floor.webp, 2 m square) laid like floor tiles across
     the slab, each tile its own <img> on its own layer; all of them share one copy of the picture. (It used to be the
     slab's repeating background, but then a phone has to paint the whole tilted slab into memory at full sharpness.)
       t      the tile: its picture (img), how many metres square (size), and where the pattern starts (x, y)
       x0, y0 the first tile's corner: the start, stepped back by whole tiles until it's at or just before the slab's edge
     Each tile is 1 cm bigger than the step between them, so neighbours overlap a hair and no seam can show. */
  function laySparkle(el, t, name) {
    const R = S.room, w = R.Wm, h = name === "floor-near" ? R.DNm : R.Dm - R.DNm;   // the slab, in metres
    const s = t.size, x0 = t.x - Math.ceil(t.x / s) * s, y0 = t.y - Math.ceil(t.y / s) * s;
    for (let y = y0; y < h; y += s) for (let x = x0; x < w; x += s) {
      const i = new Image(); i.alt = ""; i.decoding = "async"; i.draggable = false; i.className = "tile";
      if (FINAL) i.dataset.gl = IMG + t.img; else i.src = IMG + t.img;
      Object.assign(i.style, { left: m(x), top: m(y), width: m(s + .01), height: m(s + .01) });
      el.appendChild(i);
    }
  }
  let liveCss = null;
  function putUpTheSet() {
    room.textContent = "";
    for (const [name, w] of Object.entries(S.walls)) {
      const el = document.createElement("div");
      el.className = "wall w-" + name;
      if (w.style) el.style.cssText = w.style;
      if (w.tile) laySparkle(el, w.tile, name);           // (the floor: its sparkle, a small picture laid every 2 m)
      w.bands.forEach(b => el.appendChild(picture(b)));
      w.hot.forEach(h => el.appendChild(button(h)));
      room.appendChild(el);
    }
    for (const p of S.pieces) {
      if (p.kind === "panel") {                          // a glass roof slope
        const el = document.createElement("div");
        el.className = "panel"; el.style.cssText = p.style;
        p.bands.forEach(b => el.appendChild(picture(b)));
        room.appendChild(el);
      } else {                                           // something standing in the room, z metres back from the door
        const i = picture(p, "piece");
        i.style.transform = `translateZ(${m(-p.z)})`;
        i.dataset.z = p.z;                               // (the final stage draws the farthest first)
        room.appendChild(i);
      }
    }
    room.insertAdjacentHTML("beforeend", S.live);
    if (!liveCss) { liveCss = document.createElement("style"); document.head.appendChild(liveCss); }
    liveCss.textContent = S.css;
    hangPoster();
    if (FINAL) finalReady = FINAL.build(room, posterLook);   // the final stage measures every box, loads its pictures
  }

  /* STEP 2B · HANG THE POSTER ON THE BLACK WALL (WALL_POSTER in data.js)
     The box in data.js says which stretch of the right-hand wall it fills. The poster is made as big as fits in that
     box without stretching: first try the box's full height; if that would be too wide, use its full width instead.
     Then it's centred in the box.
     Along the right-hand wall, x is measured from the back corner (x 0 = by the café) toward the door, and y from
     the TOP of the wall down (y 0 = the top), so a height off the floor becomes HM minus that height. */
  // Where the Edison bulbs' warm light is brightest on this wall: metres from the back corner, and up from the floor.
  // (post.js lays a warm patch there, baked into the wall's picture; the poster gets the same light.)
  const BULB_GLOW = { wide: [5.42, 2.86], narrow: [6.56, 2.86] };
  // The book on the poster, from the storefront's own list (POSTERS in data.js), so the BUY IT button always goes
  // to the same shop as the storefront's
  const BEST = ((window.NRSF || {}).POSTERS || []).find(p => p.kind === "bestseller");
  if (BEST) { $("lb-buy").href = BEST.link; $("pop-poster").setAttribute("aria-label", BEST.book + " by " + BEST.author); }
  function hangPoster() {
    const P = DATA.WALL_POSTER, box = P && P[setName], wall = room.querySelector(".w-right");
    if (!box || !wall) return;
    const HM = S.room.HM, Dm = S.room.Dm, boxW = box.to - box.from, boxH = box.top - box.bottom;
    const h = Math.min(boxH, boxW / P.shape), w = h * P.shape;        // as big as fits, keeping its shape
    const x = box.from + (boxW - w) / 2;                               // centred along the stretch...
    const y = HM - (box.bottom + (boxH - h) / 2) - h;                  // ...and up and down (its top edge, down from the top)
    // (a button: clicking it opens popup 5, the poster up close; data-label is the name tag that follows the mouse)
    const el = document.createElement("button");
    el.type = "button"; el.className = "poster"; el.dataset.pop = "poster"; el.dataset.label = BEST ? BEST.book : "Best Storyteller";
    el.setAttribute("aria-label", (P.alt || "The Best Storyteller poster") + " Open it up close");
    Object.assign(el.style, { left: m(x), top: m(y), width: m(w), height: m(h) });
    // (Oct 31) The wall shows a copy sized for the wall (P.wall, 49 KB); the popup shows the big copy (P.closeup),
    // downloaded only when it's opened. (The backup 3D version keeps the big pictures on the wall.)
    const src = IMG + (FINAL && P.wall ? P.wall : (setName === "narrow" && P.phone ? P.phone : P.img));
    // popup 5 shows the poster big, with the BUY IT button under it (held back until the popup opens)
    const lb = $("lb-poster"); if (!lb.src) lb.dataset.src = IMG + (P.closeup || (setName === "narrow" && P.phone ? P.phone : P.img)); lb.alt = P.alt || "";
    // Over the poster, from the bottom up (the same order as on the wall in post.js): the ivy, then the room's light.
    // Each is sized to what it covers on the wall and slid back by the poster's own position, so it lines up
    // exactly with the wall around the poster.
    //   THE IVY: the bottom of the same picture that runs along the top of the wall (post/ivy-wall.webp: 6.4 m wide,
    //   2.5 m tall, repeating, started 2.3 m in on this wall). ivy-wall-fringe.webp is just its lower part, the long
    //   strands from 1.2 m to 2.5 m down from the top of the wall (a small download). It shows over the poster's top
    //   margin, then fades out (the mask) just above the words. (So keep the poster's top at 6.0 m or lower.)
    const ivy = document.createElement("span");
    ivy.className = "poster-ivy";
    const words = .05 + (h - .1) * 55 / 1102;                         // where the lettering starts, down from the poster's top (m)
    const [gx, gy] = BULB_GLOW[setName] || [0, 0], gw = 2.9, gh = 4;  // the bulbs' warm light: centre, and how far it spreads (m)
    // all of it as numbers, in metres: the final stage paints the poster from these (assets/post-final.js, part 3)
    posterLook = { x, y, w, h, img: src, pad: .05, ring: .012, ringColour: "#3a3a3a",
      shadow: { dy: .04, blur: .14, colour: "rgba(0,0,0,.85)" },
      ivy: { img: IMG + "post/ivy-wall-fringe.webp", size: [6.4, 1.3], pos: [-2.3 - x, 1.2 - y], fade: [words * .45, words * .9] },
      light: { Dm, HM, glow: [gx, gy, gw, gh] } };
    if (FINAL) { wall.appendChild(el); return; }                    // (the final stage: just the button; the poster is drawn)
    const img = new Image(); img.decoding = "async"; img.draggable = false; img.alt = ""; img.src = src;
    const fade = `linear-gradient(#000 ${m(words * .45)}, transparent ${m(words * .9)})`;
    Object.assign(ivy.style, { backgroundImage: `url(${IMG}post/ivy-wall-fringe.webp)`, backgroundRepeat: "repeat-x",
      backgroundSize: `${m(6.4)} ${m(1.3)}`, backgroundPosition: `${m(-2.3 - x)} ${m(1.2 - y)}`, maskImage: fade, webkitMaskImage: fade });
    //   THE LIGHT (the same as .nrp-wallshade-r in post.css, plus the bulbs' warm light, kept soft at its edges).
    //   (In a list of backgrounds, the FIRST one is drawn on top.)
    const light = document.createElement("span");
    light.className = "poster-light";
    Object.assign(light.style, {
      backgroundImage: [
        "radial-gradient(closest-side, rgba(255,186,110,.16), rgba(255,170,90,.05) 69%, rgba(255,170,90,0))",           // the bulbs' warm light
        "linear-gradient(0deg, rgba(0,0,0,.45), rgba(0,0,0,0) 14%, rgba(0,0,0,0) 85%, rgba(0,0,0,.35))",                // darker at the floor and the top
        "linear-gradient(90deg, rgba(255,246,226,.16), rgba(255,246,226,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.35))"    // the warm wash from the glass
      ].join(","),
      backgroundSize: [`${m(gw)} ${m(gh)}`, `${m(Dm)} ${m(HM)}`, `${m(Dm)} ${m(HM)}`].join(","),
      backgroundPosition: [`${m(gx - gw / 2 - x)} ${m(HM - gy - gh / 2 - y)}`, `${m(-x)} ${m(-y)}`, `${m(-x)} ${m(-y)}`].join(",")
    });
    el.append(img, ivy, light);
    wall.appendChild(el);
  }

  /* STEP 3 · THE CAMERA COMES DOWN THE STAIRS (the original room's own trick)
     The camera (.scene) stays fixed to the screen. As you scroll, the whole room slides UP past it by exactly the
     distance scrolled, which is what a camera being lowered sees. Only one thing changes ("translate"), and the
     browser does that on the graphics chip without repainting anything, so it stays smooth. */
  function eye() {
    // (kept between the top and the bottom of the room: a phone's bounce past either end doesn't drag the room along)
    const y = Math.min(Math.max(scrollY, 0), Math.max(0, document.documentElement.scrollHeight - innerHeight));
    room.style.translate = `0 ${-y}px 0`;
    if (FINAL) FINAL.draw();                                   // (the final stage: draw the pictures in their new places)
    if (Math.abs(scrollY - landedAt) > 40) cue.classList.add("gone");   // the cue goes once you start looking around
  }
  let eyeQueued = false;
  addEventListener("scroll", () => {
    if (!tag.hidden) tag.hidden = true;   // (Oct 31: the mouse's name tag goes while the room moves under it, instead of hanging on stale)
    if (eyeQueued) return; eyeQueued = true; requestAnimationFrame(() => { eyeQueued = false; eye(); });
  }, { passive: true });

  /* STEP 4 · WHERE YOU LAND
     A wide screen lands at the very top, up under the glass roof, like the original. A phone lands centred on Nebula
     Cafe: it finds the café's button and works out how far to scroll to bring its middle to the middle of the screen.
     (The café is on the far wall, D pixels back, so it moves P / (P + D) as far as you scroll: that's the sum below.) */
  let landedAt = 0;
  function land() {
    let y = 0;
    const cafe = room.querySelector('.spot[data-pop="cafe"]');
    if (setName === "narrow" && cafe) {
      const r = cafe.getBoundingClientRect(), k = SIZE.P / (SIZE.P + SIZE.D);
      y = Math.max(0, Math.min(SIZE.PH - SIZE.H, scrollY + (r.top + r.height / 2 - SIZE.H / 2) / k));
    }
    scrollTo(0, y); landedAt = y; eye();
  }
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";

  /* START: size it, put it up, wait for the pictures (at most 3 seconds), fade in, walk in, land. */
  function start() {
    measure(); putUpTheSet(); eye();
    const imgs = [...room.querySelectorAll("img")];
    const loaded = FINAL ? finalReady : Promise.all(imgs.map(i => i.decode().catch(() => {})));
    Promise.race([loaded, new Promise(r => setTimeout(r, 3000))]).then(() => {
      land();
      stage.classList.add("ready");
      if (!reduceMotion) { stage.classList.add("walk-in"); if (FINAL) FINAL.follow(2000); }   // (the canvas follows the walk-in)
    });
  }
  start();
  if (FINAL) FINAL.onRestore(() => { putUpTheSet(); eye(); });   // (if the phone ever takes the graphics chip away and gives it back)
  // a new screen shape (a phone turned on its side, a window resized) puts the set up again; a phone's address bar
  // sliding away (a small change in height only) doesn't
  let lastW = innerWidth, lastH = innerHeight, again;
  addEventListener("resize", () => {
    if (FINAL) FINAL.redraw();
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < lastH * .15) return;
    lastW = innerWidth; lastH = innerHeight; clearTimeout(again);
    again = setTimeout(() => { const before = setName; measure(); if (setName !== before) putUpTheSet(); eye(); }, 150);
  });

  /* STEP 5 · THE BUTTONS' NAME TAG: follows the mouse over a button; for keyboard visitors it sits on the button */
  const showTag = (text, x, y) => { tag.textContent = text; tag.style.left = x + "px"; tag.style.top = y + "px"; tag.hidden = false; };
  room.addEventListener("pointermove", e => {
    const b = e.target.closest(".spot, .poster");
    if (b && e.pointerType === "mouse") showTag(b.dataset.label, e.clientX, e.clientY); else tag.hidden = true;
  });
  room.addEventListener("pointerleave", () => (tag.hidden = true));
  room.addEventListener("focusin", e => { const b = e.target.closest(".spot, .poster"); if (!b) return; const r = b.getBoundingClientRect(); showTag(b.dataset.label, r.left + r.width / 2, r.top + r.height / 2); });
  room.addEventListener("focusout", () => (tag.hidden = true));

  /* STEP 6 · OPEN AND CLOSE THE POPUPS
     Every button with data-pop="name" opens the <dialog> with id "pop-name". The first time a popup opens,
     its held-back pictures (data-src) are switched on, which is when they download. While it's open the page
     underneath stays put (.locked). */
  function openPop(name) {
    const pop = $("pop-" + name);
    pop.querySelectorAll("[data-src]").forEach(el => { el.src = el.dataset.src; el.removeAttribute("data-src"); });
    if (name === "gallery") showHang();
    tag.hidden = true;
    document.documentElement.classList.add("locked");
    pop.showModal();
  }
  // (one listener for the whole page: it catches a click on any button with data-pop, in the room or the directory)
  document.addEventListener("click", e => { const b = e.target.closest("[data-pop]"); if (b) openPop(b.dataset.pop); });
  document.querySelectorAll("dialog.pop").forEach(pop => {
    pop.addEventListener("close", () => document.documentElement.classList.remove("locked"));
    pop.querySelector(".close").addEventListener("click", () => pop.close());
    // a click on the dark around the picture closes the popup too (data-empty marks those dark areas);
    // in the gallery's viewer it steps back to the whole exhibit first
    pop.addEventListener("click", e => {
      if (e.target !== pop && !e.target.hasAttribute("data-empty")) return;
      if (pop.id === "pop-gallery" && !viewer.hidden) showHang(); else pop.close();
    });
  });

  /* STEP 6B · ZOOMING INTO THE WISHING WALL
     A click (or tap) on the wall makes it 3 times the size it fits at, and scrolls so the spot you clicked stays
     under your finger. Another click shows the whole wall again. */
  const wallBox = document.querySelector(".wall-scroll"), wallImg = $("wall-img"), wallHint = $("wall-hint");
  const tapWord = matchMedia("(pointer: coarse)").matches ? "Tap" : "Click";
  wallHint.textContent = tapWord + " the wall to zoom in";
  wallImg.addEventListener("click", e => {
    const r = wallImg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    const zoom = !wallBox.classList.contains("zoomed");
    if (zoom) { wallImg.style.width = r.width * 3 + "px"; wallImg.style.height = r.height * 3 + "px"; }
    else { wallImg.style.width = wallImg.style.height = ""; }
    wallBox.classList.toggle("zoomed", zoom);
    wallHint.textContent = zoom ? tapWord + " again to see the whole wall" : tapWord + " the wall to zoom in";
    if (zoom) {
      const r2 = wallImg.getBoundingClientRect(), b = wallBox.getBoundingClientRect();
      wallBox.scrollLeft += (r2.left + fx * r2.width) - e.clientX;
      wallBox.scrollTop += (r2.top + fy * r2.height) - e.clientY;
    }
  });
  $("pop-wall").addEventListener("close", () => { wallBox.classList.remove("zoomed"); wallImg.style.width = wallImg.style.height = ""; });

  /* STEP 7 · THE WISHES AS WORDS, for screen readers (the wall itself is a picture) */
  (DATA.WISHES || []).forEach(w => {
    const li = document.createElement("li");
    li.textContent = w.wish.replace(/\*\*/g, "") + " (" + w.name + (w.human === false ? "" : ", " + (w.title || "Human")) + ")";
    $("wishes").appendChild(li);
  });

  /* STEP 8 · THE GALLERY
     The hang: every photo in data.js as a small framed print, in order. Click one and the viewer
     shows it whole, with its label. ‹ › (or the arrow keys, or a swipe) move along; "All photos" or Escape
     goes back to the hang. */
  const G = DATA.GALLERY || [], LABEL = DATA.GALLERY_LABEL || {};
  const hang = $("hang"), viewer = $("viewer");
  let at = 0;
  const plain = t => String(t || "").replace(/\*/g, "");                     // the words without the *italics* stars
  // A label line, with any *starred* words set in italics (every odd piece between the stars is italic).
  // Words in (brackets) stay together on one line, so "(Filipino-American, b. 1986)" never splits at its hyphen.
  function setLine(el, text) {
    el.textContent = "";
    String(text || "").split("*").forEach((part, i) => {
      if (!part) return;
      const box = i % 2 ? el.appendChild(document.createElement("em")) : el;
      part.split(/(\([^)]*\))/).forEach(bit => {
        if (!bit) return;
        if (bit[0] === "(") { const keep = document.createElement("span"); keep.style.whiteSpace = "nowrap"; keep.textContent = bit; box.appendChild(keep); }
        else box.appendChild(document.createTextNode(bit));
      });
    });
  }
  $("g-title").textContent = plain(LABEL.title || "LIFE").split(" ")[0];   // "Life" (shown in capitals)
  // The line under LIFE: the title, a dot, the artist ("Life Exhibit, 2026 · KATHI ERIC DALGUNTAS (…)"). Each part is
  // its own <span>, so on a phone they can stack one to a line, with the dot hidden (see the phone rules in PART 1).
  [plain(LABEL.title), plain(LABEL.artist)].filter(Boolean).forEach((t, i) => {
    if (i) { const dot = document.createElement("span"); dot.className = "g-dot"; dot.textContent = " · "; $("g-sub").appendChild(dot); }
    const part = document.createElement("span"); part.textContent = t; $("g-sub").appendChild(part);
  });
  G.forEach((p, i) => {
    const print = document.createElement("button");
    print.className = "print"; print.type = "button";
    print.setAttribute("aria-label", "Photo " + (i + 1) + ": " + (p.alt || ""));
    const img = document.createElement("img");
    img.alt = "";
    img.dataset.src = IMG + (p.thumb || p.img.replace(/[^/]+$/, "wall/$&"));   // the small copy (same name, in wall/); the big one loads in the viewer
    if (p.crop) img.style.objectPosition = p.crop;                               // which part of the photo the square keeps
    print.appendChild(img);
    print.addEventListener("click", () => show(i));
    $("grid").appendChild(print);
  });
  function showHang() {
    viewer.hidden = true; hang.hidden = false;
    const print = $("grid").children[at]; if (print && $("pop-gallery").open) print.focus({ preventScroll: true });
  }
  function show(i) {
    at = (i + G.length) % G.length;                                  // wrap around: after the last comes the first
    const p = G[at], L = Object.assign({}, LABEL, p);                // the shared label, with this photo's own words on top
    const img = $("v-img");
    img.src = IMG + p.img; img.alt = p.alt || ""; img.style.aspectRatio = String(p.ar || 1);
    setLine($("v-artist"), L.artist);
    setLine($("v-title"), L.title);
    setLine($("v-medium"), L.medium);
    setLine($("v-credit"), L.credit);
    $("v-count").textContent = String(at + 1).padStart(2, "0") + " / " + String(G.length).padStart(2, "0");
    if (viewer.hidden) { hang.hidden = true; viewer.hidden = false; $("v-next").focus({ preventScroll: true }); }
    [at + 1, at - 1].forEach(j => { new Image().src = IMG + G[(j + G.length) % G.length].img; });   // fetch the neighbours early
  }
  $("v-prev").addEventListener("click", () => show(at - 1));
  $("v-next").addEventListener("click", () => show(at + 1));
  $("v-all").addEventListener("click", showHang);
  const gallery = $("pop-gallery");
  gallery.addEventListener("keydown", e => {
    if (viewer.hidden) return;
    if (e.key === "ArrowRight") show(at + 1);
    if (e.key === "ArrowLeft") show(at - 1);
  });
  gallery.addEventListener("cancel", e => { if (!viewer.hidden) { e.preventDefault(); showHang(); } });   // Escape: back to the hang first
  let startX = null;                                                 // a swipe: where the finger went down vs. where it came up
  viewer.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, { passive: true });
  viewer.addEventListener("touchend", e => {
    if (startX == null) return;
    const dx = e.changedTouches[0].clientX - startX; startX = null;
    if (Math.abs(dx) > 45) show(at + (dx < 0 ? 1 : -1));
  }, { passive: true });

  /* STEP 9 · LEAVING: back out to Daydream St. through white light (the storefront fades in from it) */
  document.querySelector(".back").addEventListener("click", e => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    e.preventDefault();
    const href = e.currentTarget.href;
    document.body.classList.add("leaving");
    try { sessionStorage.setItem("nr-light", "1"); } catch (err) {}
    setTimeout(() => (location.href = href), 600);
  });
  addEventListener("pageshow", () => document.body.classList.remove("leaving"));   // coming back with the Back button
})();
</script>
</body>
</html>
