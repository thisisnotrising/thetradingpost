<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOT RISING Newsstand</title>
<meta name="description" content="Every NOT RISING cover feature, as a magazine you can flip through.">
<!-- Link preview: what apps (iMessage, Substack, Facebook, X) show when this page's link is shared.
     The picture is assets/img/share-card.jpg (1200x630). Addresses must be full https:// links. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="NOT RISING">
<meta property="og:title" content="NOT RISING Newsstand">
<meta property="og:description" content="Every NOT RISING cover feature, as a magazine you can flip through.">
<meta property="og:url" content="https://nebularising.media/thetradingpost/newsstand/">
<meta property="og:image" content="https://nebularising.media/thetradingpost/assets/img/share-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Post at 777 Daydream St.: a black-and-gold shopfront wrapped in red Boston ivy, with a lit Newsstand window, a red door marked 9¾ and a black door marked 10.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@600&family=Arimo:ital,wght@0,400..700;1,400..700&display=swap">
<style>
  /* basic reset: no page margin, phone notches respected */
  html { box-sizing: border-box; } *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<!-- "?v=2026-11-05" = the date these files last changed. Change it whenever you edit them (add a letter, like 2026-11-04b, for a second change on the same day), so every visitor's browser
     fetches the new copy instead of an old saved one (no hard refresh needed). -->
<link rel="stylesheet" href="../assets/newsstand.css?v=2026-11-05">
<!-- Came through a storefront door? Fade in from the white light (the door sets "nr-light" just before leaving) -->
<style>
html.from-light body::after { content: ""; position: fixed; inset: 0; z-index: 2147483647; background: #fff; pointer-events: none; animation: nr-from-light 1.2s ease-out .1s both; }
@keyframes nr-from-light { to { opacity: 0; visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { html.from-light body::after { display: none; } }
</style>
<!-- Opened inside THE POST's Newsstand popup (an iframe = a window onto this page, set inside THE POST)?
     Then this page gets the label "in-post". (Nov 5) The signposts now show there too, exactly as on this page on its own:
       ← 777 Daydream St.  has target="_top" (below), which means "open in the WHOLE browser window", so it takes you
                           out to the street instead of loading the street inside the popup.
       Nebula Cafe →       closes this popup and presses THE POST's own Cafe button (newsstand.js, "Nebula Cafe →"),
                           so you walk into the café through the same door as everywhere else in the room.
     The popup's × sits in the top right corner, right where "Nebula Cafe →" is, so inside the popup (on any screen up to
     1280 px wide) the top pair of signposts steps down one row, under the ×, and the marquee steps down with them
     (newsstand.css, "INSIDE THE POST"). -->
<script>if (window.self !== window.top) document.documentElement.classList.add("in-post");</script>
<script>try { if (sessionStorage.getItem("nr-light")) { sessionStorage.removeItem("nr-light"); document.documentElement.classList.add("from-light"); } } catch (e) {}</script>
</head>
<body>
<!-- NOT RISING Newsstand: the kiosk (what you see on the page) -->
<div class="nrns stand" id="nrns-stand" lang="en">
  <a class="nrns-back" href="https://nebularising.media/thetradingpost/" target="_top">← 777 Daydream St.</a>
  <a class="nrns-back nrns-fwd nrns-cafe" href="../post/cafe">Nebula Cafe →</a>
  <header class="sign"><div class="lights" id="nrns-sign-lights" aria-hidden="true"></div><div class="board"><h1 id="nrns-marquee" aria-label="Now Soaring">NOW SOARING</h1></div></header>
  <span class="awning" aria-hidden="true"></span>
  <div class="tabs" role="tablist" id="nrns-tabs" aria-label="Issues"></div>
  <section class="rack" role="tabpanel" aria-label="Issues on the rack">
    <div class="pockets" id="nrns-pockets"></div>
    <div class="rack-note" id="nrns-note" hidden></div>
    <div class="lights" id="nrns-lights" aria-hidden="true"></div>
  </section>
  <!-- The same two signposts again at the bottom, so nobody has to scroll back up to leave -->
  <nav class="nrns-foot" aria-label="Leave the newsstand">
    <a class="nrns-back" href="https://nebularising.media/thetradingpost/" target="_top">← 777 Daydream St.</a>
    <a class="nrns-back nrns-fwd nrns-cafe" href="../post/cafe">Nebula Cafe →</a>
  </nav>
  <!-- Camera flashes are added here by the script -->
  <div class="flashes" aria-hidden="true"></div>
</div>

<!-- The reader, the measuring room and the toast. The script moves
     this block to the end of the page so it can cover the full screen. -->
<div class="nrns" id="nrns-overlay" lang="en">
  <!-- THE READER (rebuilt Nov 4): the open magazine fills the screen, and the buttons float on top.
       Wide (landscape) screen: a two-page spread as tall as the screen; the buttons sit in the dark strips
       to its left and right (or fade away over its edges when there is no strip, as on an iPad).
       Tall (portrait) screen: one page at a time, with a row of buttons above it and a row below.
       Where each button goes is in newsstand.css, "THE READER". -->
  <div class="reader" id="nrns-reader" role="dialog" aria-modal="true" aria-labelledby="nrns-reader-title" hidden>
    <div class="stage" id="nrns-stage"><div class="sizer" id="nrns-sizer"></div></div>
    <!-- ZOOM: the open page(s), big enough to read, in a box you scroll (the script fills it) -->
    <div class="r-zoomview" id="nrns-zoomview" hidden><div class="r-zoompages" id="nrns-zoompages"></div></div>
    <!-- top left: full screen (only where the browser allows it) and the title (only when there is room) -->
    <div class="r-group r-tl">
      <button class="r-btn r-round" id="nrns-full" type="button" aria-label="Full screen" title="Full screen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fs-in" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="fs-out" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
      </button>
      <span class="r-title" id="nrns-reader-title"></span>
    </div>
    <!-- top right: close, and (interview features only) the link to read it online -->
    <div class="r-group r-tr">
      <button class="r-btn r-round" id="nrns-close" type="button" aria-label="Put the magazine back" title="Close">✕&#xFE0E;</button>
      <a class="r-btn" id="nrns-site-link" href="#" target="_blank" rel="noopener">Online ↗&#xFE0E;</a>
    </div>
    <!-- left and right: turn the page -->
    <button class="r-btn r-round r-arrow r-prev" id="nrns-prev" type="button" aria-label="Previous page">←&#xFE0E;</button>
    <button class="r-btn r-round r-arrow r-next" id="nrns-next" type="button" aria-label="Next page">→&#xFE0E;</button>
    <!-- bottom left: zoom in to read (and back out) -->
    <div class="r-group r-bl">
      <button class="r-btn r-round" id="nrns-zoom" type="button" aria-label="Zoom in to read" title="Zoom in to read">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/><path class="zm-plus" d="M10.5 7.5v6"/></svg>
      </button>
    </div>
    <!-- bottom right (bottom centre on a tall screen): which page you're on -->
    <div class="r-group r-br"><span class="r-counter" id="nrns-counter" aria-live="polite"></span></div>
    <!-- a one-time tip, shown for a few seconds when the first magazine opens -->
    <span class="r-hint" id="nrns-hint" aria-hidden="true"></span>
  </div>
  <div class="measure" id="nrns-measure" aria-hidden="true"></div>
  <div class="toast" id="nrns-toast" role="status" hidden></div>
</div>


<!-- Where the pictures live, then the data, the page-flip library, and the engine -->
<script>window.NRNS_BASE = "../assets/img/";</script>
<script src="../assets/data.js?v=2026-11-05"></script>
<script src="../assets/vendor/page-flip.browser.js"></script>
<script src="../assets/newsstand.js?v=2026-11-07"></script>
</body>
</html>
